<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>लाइव वीडियो और टेक्स्ट चैट</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .video-section {
            display: flex;
            background: #111;
            padding: 15px;
            gap: 15px;
            justify-content: center;
        }

        .video-box {
            position: relative;
            flex: 1;
            aspect-ratio: 4/3;
            background: #222;
            border-radius: 8px;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        .controls {
            text-align: center;
            padding: 10px;
            background: #f8f9fa;
            border-bottom: 1px solid #ddd;
        }

        #startBtn {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        #startBtn:hover {
            background: #218838;
        }

        .text-chat-section {
            display: flex;
            flex-direction: column;
            height: 350px;
            background: #fff;
        }

        .chat-window {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            padding: 8px 12px;
            border-radius: 8px;
            max-width: 75%;
            font-size: 14px;
        }

        .message.system {
            background: #e9ecef;
            color: #6c757d;
            align-self: center;
            font-style: italic;
        }

        .message.you {
            background: #007bff;
            color: white;
            align-self: flex-end;
        }

        .message.stranger {
            background: #e4e6eb;
            color: black;
            align-self: flex-start;
        }

        .input-area {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ddd;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
        }

        #sendBtn {
            background: #007bff;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        #sendBtn:disabled, #messageInput:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }

        /* नया कस्टम पॉपअप (Modal CSS) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .modal-box p {
            margin-bottom: 20px;
            font-size: 16px;
            color: #333;
        }

        .modal-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .modal-btn:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="video-section">
            <div class="video-box">
                <video id="localVideo" autoplay playsinline muted></video>
                <div class="video-label">आप (Local)</div>
            </div>
            <div class="video-box">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="video-label">सामने वाला (Remote)</div>
            </div>
        </div>

        <div class="controls">
            <button id="startBtn">कैमरा शुरू करें</button>
        </div>

        <div class="text-chat-section">
            <div class="chat-window" id="chatWindow">
                <div class="message system">सिस्टम: चैट शुरू करने के लिए कैमरा चालू करें।</div>
            </div>
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="अपना संदेश टाइप करें..." disabled>
                <button id="sendBtn" disabled>भेजें</button>
            </div>
        </div>
    </div>

    <!-- नया कस्टम पॉपअप विंडो HTML -->
    <div class="modal-overlay" id="permissionModal">
        <div class="modal-box">
            <p><strong>चैट करने के लिए कैमरा और माइक की अनुमति आवश्यक है।</strong> <br><br> कृपया ब्राउज़र के ऊपरी हिस्से में आने वाले पॉपअप पर 'Allow/अनुमति' पर क्लिक करें।</p>
            <button class="modal-btn" id="modalOkBtn">हाँ, अनुमति दें</button>
        </div>
    </div>

    <script>
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const startBtn = document.getElementById('startBtn');
        const sendBtn = document.getElementById('sendBtn');
        const messageInput = document.getElementById('messageInput');
        const chatWindow = document.getElementById('chatWindow');
        const permissionModal = document.getElementById('permissionModal');
        const modalOkBtn = document.getElementById('modalOkBtn');

        let localStream;

        // मुख्य कैमरा शुरू करने वाला फंक्शन
        async function openCamera() {
            permissionModal.style.display = 'none'; // पॉपअप छुपाएं
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;
                remoteVideo.srcObject = localStream;

                messageInput.disabled = false;
                sendBtn.disabled = false;
                startBtn.style.display = 'none';

                appendMessage('सिस्टम', 'कैमरा कनेक्ट हो गया है! आप चैट कर सकते हैं।', 'system');
            } catch (error) {
                console.error('Error:', error);
                // अगर फिर भी ब्लॉक हो, तो कस्टम पॉपअप दोबारा दिखाएं
                permissionModal.style.display = 'flex';
            }
        }

        startBtn.addEventListener('click', openCamera);
        
        // पॉपअप के 'हाँ, अनुमति दें' बटन पर क्लिक करने पर
        modalOkBtn.addEventListener('click', openCamera);

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function sendMessage() {
            const text = messageInput.value.trim();
            if (text === '') return;

            appendMessage('आप', text, 'you');
            messageInput.value = '';

            setTimeout(() => {
                appendMessage('अजनबी', 'नमस्ते! आपका नया पॉपअप बटन कोड सही काम कर रहा है। 👍', 'stranger');
            }, 1000);
        }

        function appendMessage(sender, text, type) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', type);
            if (type === 'system') {
                msgDiv.innerText = text;
            } else {
                msgDiv.innerText = `${sender}: ${text}`;
            }
            chatWindow.appendChild(msgDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }
    </script>
</body>
</html>
