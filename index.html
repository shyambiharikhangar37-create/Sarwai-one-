<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BBL Professional Video Chat</title>
    
    <!-- बदला हुआ सबसे तेज़ CDN लिंक जो कभी ब्लॉक नहीं होगा -->
    <script src="https://cloudflare.com"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
        }

        .chat-container {
            width: 100%;
            max-width: 500px;
            height: 100%;
            background: #1e293b;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .app-header {
            background: #0f172a;
            color: #fff;
            padding: 12px 15px;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            border-bottom: 1px solid #334155;
        }

        .id-badge {
            background: #3b82f6;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-family: monospace;
            user-select: all;
        }

        .connect-box {
            display: flex;
            gap: 8px;
            padding: 10px 15px;
            background: #1e293b;
            border-bottom: 1px solid #334155;
        }

        .connect-box input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            outline: none;
            font-size: 14px;
        }

        .connect-box button {
            background: #10b981;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .connect-box button:hover { background: #059669; }

        .video-section {
            position: relative;
            background: #000;
            width: 100%;
            aspect-ratio: 4/3;
            overflow: hidden;
            flex-shrink: 0;
        }

        .video-box.remote-box {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .video-box.local-box {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 100px;
            height: 135px;
            border-radius: 8px;
            border: 2px solid #3b82f6;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 10;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-label {
            position: absolute;
            top: 5px;
            left: 5px;
            background: rgba(15, 23, 42, 0.7);
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            z-index: 12;
        }

        .text-chat-section {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            min-height: 0;
            background: #0f172a;
        }

        .chat-window {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            padding: 8px 14px;
            border-radius: 12px;
            max-width: 80%;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message.system {
            background: #334155;
            color: #cbd5e1;
            align-self: center;
            font-size: 12px;
            border-radius: 6px;
        }

        .message.you {
            background: #3b82f6;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .message.stranger {
            background: #334155;
            color: white;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .input-area {
            display: flex;
            padding: 12px;
            border-top: 1px solid #334155;
            gap: 10px;
            background: #1e293b;
        }

        #messageInput {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
        }

        #sendBtn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 0 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        #sendBtn:disabled, #messageInput:disabled {
            background: #475569;
            color: #94a3b8;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="app-header">
            <div>आपकी चैट ID: <span id="myIdDisplay" class="id-badge">कनेक्ट हो रहा है...</span></div>
        </div>

        <div class="connect-box">
            <input type="text" id="peerIdInput" placeholder="सामने वाले की ID यहाँ डालें...">
            <button id="connectBtn">कनेक्ट करें</button>
        </div>

        <div class="video-section">
            <div class="video-box local-box">
                <video id="localVideo" autoplay playsinline muted></video>
                <div class="video-label">आप</div>
            </div>
            <div class="video-box remote-box">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="video-label">सामने वाला</div>
            </div>
        </div>

        <div class="text-chat-section">
            <div class="chat-window" id="chatWindow">
                <div class="message system">सिस्टम: शुरुआत हो रही है...</div>
            </div>
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="अपना संदेश टाइप करें..." disabled>
                <button id="sendBtn" disabled>भेजें</button>
            </div>
        </div>
    </div>

    <script>
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const myIdDisplay = document.getElementById('myIdDisplay');
        const peerIdInput = document.getElementById('peerIdInput');
        const connectBtn = document.getElementById('connectBtn');
        const sendBtn = document.getElementById('sendBtn');
        const messageInput = document.getElementById('messageInput');
        const chatWindow = document.getElementById('chatWindow');

        let localStream = null;
        let peer = null;
        let currentConn = null; 

        function addMessage(text, type) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', type);
            msgDiv.innerText = text;
            chatWindow.appendChild(msgDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        async function startCamera() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;
                addMessage("सिस्टम: आपका कैमरा चालू हो गया है।", "system");
            } catch (err) {
                console.error(err);
                addMessage("सिस्टम: कैमरा परमिशन नहीं मिली (सिर्फ टेक्स्ट चैट चालू है)।", "system");
            }
            
            // कैमरा चेक होने के तुरंत बाद ID बनाने का लॉजिक चलाएं
            initPeer(); 
        }

        function initPeer() {
            // अगर लाइब्रेरी लोड नहीं भी हुई, तो सुरक्षित तरीके से हैंडल करने के लिए try-catch लगाया है
            try {
                const randomId = Math.floor(100000 + Math.random() * 900000).toString();
                
                peer = new Peer(randomId, {
                    config: {
                        'iceServers': [
                            { 'urls': 'stun:://google.com' },
                            { 'urls': 'stun:://google.com' }
                        ]
                    }
                });

                peer.on('open', (id) => {
                    myIdDisplay.innerText = id;
                    addMessage("सिस्टम: आपकी नई ID तैयार है! इसे अपने दोस्त को भेजें और कनेक्ट करें।", "system");
                });

                peer.on('error', (err) => {
                    console.error("Peer Error:", err.type);
                    if(err.type === 'unavailable-id') {
                        location.reload();
                    }
                });

                peer.on('call', (call) => {
                    call.answer(localStream); 
                    call.on('stream', (remoteStream) => {
                        remoteVideo.srcObject = remoteStream; 
                    });
                });

                peer.on('connection', (conn) => {
                    currentConn = conn;
                    setupChatFeatures();
                    addMessage("सिस्टम: कोई आपसे कनेक्ट हो गया है!", "system");
                });

            } catch (setupError) {
