<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BBL chat</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .video-section {
            position: relative;
            background: #111;
            width: 100%;
            aspect-ratio: 4/3;
            overflow: hidden;
            flex-shrink: 0;
        }

        .video-box.remote-box {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .video-box.local-box {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 90px;
            height: 120px;
            border-radius: 6px;
            border: 2px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 10;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #222; /* कैमरा बंद होने पर बैकग्राउंड */
        }

        .video-label {
            position: absolute;
            bottom: 5px;
            left: 5px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            z-index: 12;
        }

        .controls {
            text-align: center;
            padding: 10px;
            background: #f8f9fa;
            border-bottom: 1px solid #ddd;
            flex-shrink: 0;
        }

        #cameraToggleBtn {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            transition: background 0.3s;
        }

        #cameraToggleBtn:hover {
            opacity: 0.9;
        }

        .text-chat-section {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            min-height: 0;
            background: #fff;
        }

        .chat-window {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            padding: 10px 14px;
            border-radius: 12px;
            max-width: 80%;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message.system {
            background: #e9ecef;
            color: #6c757d;
            align-self: center;
            font-style: italic;
            font-size: 12px;
            text-align: center;
        }

        .message.you {
            background: #007bff;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.stranger {
            background: #e4e6eb;
            color: black;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .input-area {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ddd;
            gap: 10px;
            background: #fff;
            flex-shrink: 0;
        }

        #messageInput {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
            font-size: 15px;
        }

        #messageInput:focus {
            border-color: #007bff;
        }

        #sendBtn {
            background: #007bff;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        #sendBtn:disabled, #messageInput:disabled {
            background: #cccccc;
            color: #666;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="video-section">
            <div class="video-box local-box">
                <video id="localVideo" autoplay playsinline muted></video>
                <div class="video-label">आप</div>
            </div>
            <div class="video-box remote-box">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="video-label">सामने वाला</div>
            </div>
        </div>

        <div class="controls">
            <button id="cameraToggleBtn">कैमरा चालू करें</button>
        </div>

        <div class="text-chat-section">
            <div class="chat-window" id="chatWindow">
                <div class="message system">सिस्टम: चैट शुरू करने के लिए ऊपर 'कैमरा चालू करें' बटन दबाएं।</div>
            </div>
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="अपना संदेश टाइप करें..." disabled>
                <button id="sendBtn" disabled>भेजें</button>
            </div>
        </div>
    </div>

    <script>
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const cameraToggleBtn = document.getElementById('cameraToggleBtn');
        const sendBtn = document.getElementById('sendBtn');
        const messageInput = document.getElementById('messageInput');
        const chatWindow = document.getElementById('chatWindow');

        let localStream = null;
        let isCameraOn = false;

        // कीबोर्ड खुलने पर इनपुट को स्क्रीन पर दिखाने के लिए
        messageInput.addEventListener('focus', () => {
            setTimeout(() => {
                messageInput.scrollIntoView({ behavior: 'smooth', block: 'end' });
            }, 300);
        });

        // कैमरा चालू/बंद करने का लॉजिक (Toggle)
        cameraToggleBtn.addEventListener('click', async () => {
            if (!isCameraOn) {
                // कैमरा चालू करना
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: "user" }, 
                        audio: true 
                    });
                    
                    localVideo.srcObject = localStream;
                    // नोट: असली ऐप में remoteVideo में दूसरे व्यक्ति का स्ट्रीम आएगा। 
                    // डेमो के लिए हम अभी लोकल स्ट्रीम ही दिखा रहे हैं।
                    remoteVideo.srcObject = localStream; 
                    
                    isCameraOn = true;
                    cameraToggleBtn.innerText = "कैमरा बंद करें";
                    cameraToggleBtn.style.background = "#dc3545"; // लाल रंग (बंद करने के लिए)
                    
                    // चैट एक्टिवेट करें
                    messageInput.disabled = false;
                    sendBtn.disabled = false;
                    messageInput.focus();
                    
                    addSystemMessage("कैमरा और माइक चालू हो गया है। अब आप चैट कर सकते हैं।");
                } catch (error) {
                    console.error("कैमरा एक्सेस एरर:", error);
                    alert("कैमरा चालू करने में समस्या आई। कृपया ब्राउज़र से कैमरा/माइक की अनुमति (Permission) जरूर दें।");
                }
            } else {
                // कैमरा बंद करना
                if (localStream) {
                    localStream.getTracks().forEach(track => track.stop());
                }
                localVideo.srcObject = null;
                remoteVideo.srcObject = null;
                
                isCameraOn = false;
                cameraToggleBtn.innerText = "कैमरा चालू करें";
                cameraToggleBtn.style.background = "#28a745"; // हरा रंग (चालू करने के लिए)
                
                // चैट डिसेबल करें (या आप चाहें तो चालू भी रख सकते हैं)
                messageInput.disabled = true;
                sendBtn.disabled = true;
                
                addSystemMessage("कैमरा बंद कर दिया गया है।");
            }
        });

        // मैसेज भेजने का फंक्शन
        function sendMessage() {
            const text = messageInput.value.trim();
            if (text === "") return;

            // 1. अपना मैसेज जोड़ें
            const msgDiv = document.createElement('div');
            msgDiv.className = "message you";
            msgDiv.innerText = text;
            chatWindow.appendChild(msgDiv);

            // 2. इनपुट साफ करें
            messageInput.value = "";
            
            // 3. चैट विंडो को सबसे नीचे स्क्रॉल करें
            chatWindow.scrollTop = chatWindow.scrollHeight;

            // 4. डेमो रिप्लाई (ताकि आप देख सकें कि चैट काम कर रही है)
            // असली ऐप में यहाँ WebSocket या WebRTC का डेटा आएगा
            setTimeout(() => {
                const replyDiv = document.createElement('div');
                replyDiv.className = "message stranger";
                replyDiv.innerText = "यह एक ऑटो-रिप्लाई है। असली चैट के लिए सर्वर कनेक्ट करना होगा।";
                chatWindow.appendChild(replyDiv);
                chatWindow.scrollTop = chatWindow.scrollHeight;
            }, 1000);
        }

        // भेजें बटन पर क्लिक करने पर
        sendBtn.addEventListener('click', sendMessage);

        // Enter की दबाने पर मैसेज भेजने के लिए
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // सिस्टम मैसेज जोड़ने का हेल्पर फंक्शन
        function addSystemMessage(text) {
            const msg = document.createElement('div');
            msg.className = "message system";
            msg.innerText = text;
            chatWindow.appendChild(msg);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }
    </script>
</body>
</html>
