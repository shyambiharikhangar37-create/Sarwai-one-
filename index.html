<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>लाइव वीडियो और टेक्स्ट चैट</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* वीडियो सेक्शन को रिलेटिव बनाया ताकि ओवरले काम कर सके */
        .video-section {
            position: relative;
            background: #111;
            width: 100%;
            aspect-ratio: 4/3; /* मोबाइल पर वीडियो का सही अनुपात */
            overflow: hidden;
        }

        /* सामने वाले (Remote) का कैमरा - इसे पूरी स्क्रीन पर सेट किया */
        .video-box.remote-box {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* आपका (Local) कैमरा - इसे ऊपर छोटे तैरते हुए बॉक्स में बदला */
        .video-box.local-box {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 90px;  /* मोबाइल के हिसाब से छोटा साइज */
            height: 120px;
            border-radius: 6px;
            border: 2px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 10; /* यह सामने वाले के वीडियो के ऊपर तैरता रहेगा */
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-label {
            position: absolute;
            bottom: 5px;
            left: 5px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            z-index: 12;
        }

        .controls {
            text-align: center;
            padding: 10px;
            background: #f8f9fa;
            border-bottom: 1px solid #ddd;
        }

        #startBtn {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        #startBtn:hover {
            background: #218838;
        }

        .text-chat-section {
            display: flex;
            flex-direction: column;
            height: 350px;
            background: #fff;
        }

        .chat-window {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            padding: 8px 12px;
            border-radius: 8px;
            max-width: 75%;
            font-size: 14px;
        }

        .message.system {
            background: #e9ecef;
            color: #6c757d;
            align-self: center;
            font-style: italic;
        }

        .message.you {
            background: #007bff;
            color: white;
            align-self: flex-end;
        }

        .message.stranger {
            background: #e4e6eb;
            color: black;
            align-self: flex-start;
        }

        .input-area {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ddd;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
        }

        #sendBtn {
            background: #007bff;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        #sendBtn:disabled, #messageInput:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .modal-box p {
            margin-bottom: 20px;
            font-size: 16px;
            color: #333;
        }

        .modal-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="video-section">
            <!-- आपका तैरता हुआ छोटा वीडियो बॉक्स (local-box) -->
            <div class="video-box local-box">
                <video id="localVideo" autoplay playsinline muted></video>
                <div class="video-label">आप</div>
            </div>
            <!-- सामने वाले का फुल-स्क्रीन बड़ा वीडियो बॉक्स (remote-box) -->
            <div class="video-box remote-box">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="video-label">सामने वाला</div>
            </div>
        </div>

        <div class="controls">
            <button id="startBtn">कैमरा शुरू करें</button>
        </div>

        <div class="text-chat-section">
            <div class="chat-window" id="chatWindow">
                <div class="message system">सिस्टम: चैट शुरू करने के लिए कैमरा चालू करें।</div>
            </div>
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="अपना संदेश टाइप करें..." disabled>
                <button id="sendBtn" disabled>भेजें</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="permissionModal">
        <div class="modal-box">
            <p><strong>चैट करने के लिए कैमरा और माइक की अनुमति आवश्यक है।</strong> <br><br> कृपया ब्राउज़र के ऊपरी हिस्से में आने वाले पॉपअप पर 'Allow/अनुमति' पर क्लिक करें।</p>
            <button class="modal-btn" id="modalOkBtn">हाँ, अनुमति दें</button>
        </div>
    </div>

    <script>
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const startBtn = document.getElementById('startBtn');
        const sendBtn = document.getElementById('sendBtn');
        const messageInput = document.getElementById('messageInput');
        const chatWindow = document.getElementById('chatWindow');
        const permissionModal = document.getElementById('permissionModal');
        const modalOkBtn = document.getElementById('modalOkBtn');

        let localStream;

        async function openCamera() {
            permissionModal.style.display = 'none';
            try {
                // साफ़ वीडियो के लिए HD रेजोल्यूशन रिक्वेस्ट
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: {
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        facingMode: "user"
                    }, 
                    audio: true 
                });
                
                localVideo.srcObject = localStream;
                remoteVideo.srcObject = localStream; 

                messageInput.disabled = false;
                sendBtn.disabled = false;
                startBtn.style.display = 'none';

                appendMessage('सिस्टम', 'कैमरा कनेक्ट हो गया है! अब वीडियो साफ़ और बड़ा दिखेगा।', 'system');
            } catch (error) {
                console.error('Error:', error);
                permissionModal.style.display = 'flex';
            }
        }

        startBtn.addEventListener('click', openCamera);
        modalOkBtn.addEventListener('click', openCamera);
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function sendMessage() {
            const text = messageInput.value.trim();
            if (text === '') return;

            appendMessage('आप', text, 'you');
            messageInput.value = '';
            
            setTimeout(() => {
                appendMessage('सामने वाला', 'नमस्ते! आपका नया लेआउट बहुत बढ़िया काम कर रहा है।', 'stranger');
            }, 1000);
        }

        function appendMessage(sender, text, type) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', type);
            if (type === 'system') {
                msgDiv.innerText = text;
            } else {
                msgDiv.innerHTML = `<strong>${sender}:</strong> ${text}`;
            }
            chatWindow.appendChild(msgDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }
    </script>
</body>
</html>
