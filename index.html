
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<meta name="theme-color" content="#000" />
<title>Sarwai One - Modern Video Platform</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
button{background:none;border:none;color:inherit;cursor:pointer;font:inherit}
input,textarea{font:inherit;outline:none;border:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:#000}

/* Top Bar */
.topbar{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:linear-gradient(180deg,rgba(0,0,0,.9),transparent);pointer-events:none}
.topbar .logo-container{display:flex;align-items:center;gap:8px;pointer-events:auto}
.sarwai-logo{width:34px;height:35px;border-radius:6px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 2px 8px rgba(0,0,0,0.4);flex-shrink:0}
.sarwai-logo .red-part{height:45%;background:#D32F2F;display:flex;align-items:center;justify-content:center;padding:4px;box-sizing:border-box}
.sarwai-logo .red-part span{color:#fff;font-weight:900;font-size:7.5px;letter-spacing:0.5px;line-height:1;text-transform:uppercase}
.sarwai-logo .blue-part{height:55%;background:#1565C0;display:flex;align-items:center;justify-content:center}
.sarwai-logo .play-icon{width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:8px solid #fff;margin-left:2px}
.topbar .one-text{font-size:20px;font-weight:900;background:linear-gradient(90deg,#ff0000,#ff2d55,#0044ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:1px}
.topbar .tabs{display:flex;gap:20px;pointer-events:auto}
.topbar .tab-btn{font-size:15px;font-weight:600;opacity:.6;transition:opacity .2s}
.topbar .tab-btn.active{opacity:1}

/* Feed */
.feed{flex:1;overflow-y:scroll;overflow-x:hidden;scroll-snap-type:y mandatory;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.video-item{position:relative;width:100%;height:100vh;scroll-snap-align:start;scroll-snap-stop:always;background:#000}
.video-item video{width:100%;height:100%;object-fit:contain;background:#000;transition:all .3s}
.video-item video.fit-cover{object-fit:cover}
.overlay{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.4) 0%,transparent 30%,transparent 60%,rgba(0,0,0,.8) 100%)}

/* Progress Bar */
.progress-bar{position:absolute;bottom:64px;left:0;right:0;height:3px;background:rgba(255,255,255,.2);z-index:15}
.progress-fill{height:100%;background:#ff2d55;width:0;transition:width .1s linear}

/* Controls */
.v-controls{position:absolute;bottom:80px;left:14px;right:80px;z-index:12;display:flex;align-items:center;gap:10px;pointer-events:auto}
.v-fill-btn{padding:8px 16px;border-radius:20px;background:rgba(255,45,85,.95);font-size:13px;font-weight:700;color:#fff;display:flex;align-items:center;gap:5px;border:2px solid rgba(255,255,255,.2)}
.v-fill-btn:active{transform:scale(.95)}
.v-fill-btn.active{background:rgba(255,255,255,.25);border-color:#ff2d55}
.speed-btn{padding:8px 12px;border-radius:20px;background:rgba(255,255,255,.2);font-size:12px;font-weight:700;color:#fff;backdrop-filter:blur(10px)}

/* Side Actions */
.side-actions{position:absolute;right:12px;bottom:120px;display:flex;flex-direction:column;gap:20px;pointer-events:auto;z-index:10}
.side-actions .act{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:600}
.side-actions .act .ico{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.18);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;font-size:24px;transition:transform .2s}
.side-actions .act:active .ico{transform:scale(.9)}
.side-actions .act.liked .ico{color:#ff2d55;animation:likeAnim .5s}
@keyframes likeAnim{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
.side-actions .act.sound-on .ico{color:#00ff88}
.side-actions .act.sound-off .ico{color:#ff4444}

/* Bottom Info */
.bottom-info{position:absolute;left:14px;right:80px;bottom:120px;pointer-events:auto;z-index:10}
.bottom-info .user{font-weight:700;margin-bottom:6px;font-size:15px;display:flex;align-items:center;gap:6px}
.bottom-info .user .verified{color:#00d4ff;font-size:14px}
.bottom-info .title{font-size:14px;line-height:1.35;opacity:.95;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:8px}
.bottom-info .music{font-size:12px;opacity:.85;display:flex;align-items:center;gap:6px}
.bottom-info .music .music-icon{animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Play Indicator */
.play-ind{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .25s;z-index:8}
.play-ind.show{opacity:1}
.play-ind .ring{width:80px;height:80px;border-radius:50%;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;font-size:36px}

/* Double Tap Heart */
.double-tap-heart{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:100px;pointer-events:none;z-index:9;opacity:0}
.double-tap-heart.show{animation:heartPop .8s ease-out}
@keyframes heartPop{0%{transform:translate(-50%,-50%) scale(0);opacity:0}50%{transform:translate(-50%,-50%) scale(1.2);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}

/* Loader */
.loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;z-index:5;gap:12px}
.spinner{width:44px;height:44px;border:3px solid #333;border-top-color:#ff2d55;border-radius:50%;animation:spin 1s linear infinite}
.loader-text{font-size:12px;opacity:.6}

/* Bottom Nav */
.bottomnav{position:absolute;left:0;right:0;bottom:0;z-index:25;height:64px;display:flex;align-items:center;justify-content:space-around;background:rgba(10,10,10,.97);border-top:1px solid rgba(255,255,255,.08);backdrop-filter:blur(10px);transition:transform .35s ease}
.bottomnav.nav-hidden{transform:translateY(100%)}
.nav-btn{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;opacity:.7}
.nav-btn.active{opacity:1;color:#ff2d55}
.nav-btn .n-ico{font-size:24px;line-height:1}
.nav-btn.upload .n-ico{width:46px;height:32px;border-radius:8px;background:linear-gradient(135deg,#ff2d55,#ff9500);display:flex;align-items:center;justify-content:center;position:relative}
.nav-btn.upload .n-ico::before,.nav-btn.upload .n-ico::after{content:"";position:absolute;width:30px;height:24px;border-radius:6px;background:#fff;mix-blend-mode:difference}
.nav-btn.upload .n-ico::before{transform:translateX(-4px)}
.nav-btn.upload .n-ico::after{transform:translateX(4px)}
.nav-btn.upload .n-ico span{position:relative;z-index:2;font-size:18px;color:#000;font-weight:900}

/* Modals */
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:500px;background:#141414;border-radius:18px 18px 0 0;padding:18px;max-height:85vh;overflow-y:auto;animation:slide .25s}
@keyframes slide{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet h3{margin-bottom:14px;font-size:17px}
.sheet .close{float:right;font-size:22px;opacity:.7}

/* Search */
.search-box{display:flex;gap:8px;margin-bottom:12px}
.search-box input{flex:1;background:#222;color:#fff;padding:12px 14px;border-radius:10px;font-size:14px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{padding:7px 14px;border-radius:20px;background:#222;font-size:13px}
.tab.active{background:#ff2d55}
.search-result{padding:12px;border-bottom:1px solid #222;display:flex;align-items:center;gap:12px}
.search-result .thumb{width:60px;height:80px;border-radius:8px;background:#333;flex-shrink:0}
.search-result .info{flex:1}
.search-result .info .title{font-weight:600;margin-bottom:4px}
.search-result .info .user{font-size:12px;opacity:.6}

/* Upload */
.upload-opts{display:flex;gap:14px;justify-content:center;margin-top:10px}
.upload-opt{width:120px;height:120px;border-radius:14px;background:#222;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:13px}
.upload-opt .u-ico{font-size:32px}
.upload-form{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.upload-form input,.upload-form textarea{background:#222;color:#fff;padding:12px 14px;border-radius:10px;font-size:14px}
.upload-form textarea{min-height:80px;resize:vertical}
.upload-form button{padding:12px;border-radius:10px;background:#ff2d55;font-weight:700;color:#fff}
.upload-preview{width:100%;max-height:200px;border-radius:10px;background:#222;display:flex;align-items:center;justify-content:center;overflow:hidden}
.upload-preview video{width:100%;height:100%;object-fit:contain}

/* User Profile */
.user-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #222}
.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#ff2d55,#ff9500);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
.profile-stats{display:flex;gap:20px;margin:14px 0}
.profile-stats .stat{text-align:center}
.profile-stats .stat .num{font-size:18px;font-weight:700}
.profile-stats .stat .label{font-size:11px;opacity:.6}
.login-btn,.logout-btn{width:100%;padding:12px;border-radius:10px;background:#ff2d55;font-weight:700;margin-top:10px;color:#fff}
.logout-btn{background:#333}

/* Settings */
.setting-item{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #222;font-size:14px}
.quality-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.q-btn{padding:10px;border-radius:8px;background:#222;font-size:13px;font-weight:600;color:#fff}
.q-btn.active{background:#ff2d55}

/* Remix */
.remix-opts{display:flex;gap:14px;justify-content:center;margin-top:10px}
.remix-opt{width:140px;height:100px;border-radius:14px;background:#222;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:13px}
.remix-opt .r-ico{font-size:32px}

/* Toast */
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(0,0,0,.95);padding:10px 18px;border-radius:20px;font-size:13px;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none;border:1px solid rgba(255,255,255,.15)}
.toast.show{opacity:1}

/* Comments */
.comment-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #222}
.comment-item .avatar{width:36px;height:36px;font-size:14px}
.comment-item .content{flex:1}
.comment-item .content .user{font-weight:600;font-size:13px;margin-bottom:4px}
.comment-item .content .text{font-size:13px;opacity:.9}
.comment-item .content .time{font-size:11px;opacity:.5;margin-top:4px}
.comment-input{display:flex;gap:8px;margin-top:14px}
.comment-input input{flex:1;background:#222;color:#fff;padding:12px;border-radius:20px;font-size:14px}
.comment-input button{padding:12px 20px;background:#ff2d55;border-radius:20px;font-weight:700}

/* Share Sheet */
.share-options{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:14px}
.share-opt{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px}
.share-opt .s-ico{width:56px;height:56px;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center;font-size:24px}

/* Pull to Refresh */
.pull-indicator{position:absolute;top:0;left:0;right:0;height:60px;display:flex;align-items:center;justify-content:center;transform:translateY(-100%);transition:transform .3s;z-index:5}
.pull-indicator.show{transform:translateY(0)}
.pull-indicator .spinner{width:32px;height:32px}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="logo-container">
      <div class="sarwai-logo">
        <div class="red-part"><span>Sarwai</span></div>
        <div class="blue-part"><div class="play-icon"></div></div>
      </div>
      <span class="one-text">one</span>
    </div>
    <div class="tabs">
      <button class="tab-btn active">Following</button>
      <button class="tab-btn">For You</button>
    </div>
  </div>
  
  <div class="pull-indicator" id="pullIndicator">
    <div class="spinner"></div>
  </div>
  
  <div class="feed" id="feed"></div>
  
  <nav class="bottomnav" id="bottomNav">
    <button class="nav-btn active" data-nav="home"><div class="n-ico">🏠</div><div>Home</div></button>
    <button class="nav-btn" data-nav="search"><div class="n-ico">🔍</div><div>Search</div></button>
    <button class="nav-btn upload" data-nav="upload"><div class="n-ico"><span>+</span></div><div>Upload</div></button>
    <button class="nav-btn" data-nav="inbox"><div class="n-ico">💬</div><div>Inbox</div></button>
    <button class="nav-btn" data-nav="user"><div class="n-ico">👤</div><div>Profile</div></button>
  </nav>
</div>

<!-- Search Modal -->
<div class="modal" id="searchModal">
  <div class="sheet">
    <button class="close" data-close>✕</button>
    <h3>Search</h3>
    <div class="search-box"><input id="searchInput" placeholder="Search videos, creators, hashtags..." /></div>
    <div class="tabs">
      <button class="tab active" data-tab="all">All</button>
      <button class="tab" data-tab="users">Users</button>
      <button class="tab" data-tab="videos">Videos</button>
    </div>
    <div id="searchResults"></div>
  </div>
</div>

<!-- Upload Modal -->
<div class="modal" id="uploadModal">
  <div class="sheet">
    <button class="close" data-close>✕</button>
    <h3>Create Video</h3>
    <div class="upload-opts">
      <button class="upload-opt" id="btnCamera"><div class="u-ico">📷</div><div>Camera</div></button>
      <button class="upload-opt" id="btnGallery"><div class="u-ico">🖼️</div><div>Gallery</div></button>
    </div>
    <div id="uploadFormContainer" style="display:none">
      <div class="upload-preview" id="uploadPreview"></div>
      <div class="upload-form">
        <input type="text" id="uploadTitle" placeholder="Add a catchy title..." />
        <textarea id="uploadDesc" placeholder="Describe your video..."></textarea>
        <input type="text" id="uploadTags" placeholder="#hashtags (comma separated)" />
        <button id="btnPublish">Publish Video</button>
      </div>
    </div>
    <input type="file" id="videoFileInput" accept="video/*" style="display:none" />
    <input type="file" id="cameraInput" accept="video/*" capture="environment" style="display:none" />
  </div>
</div>

<!-- Comments Modal -->
<div class="modal" id="commentsModal">
  <div class="sheet">
    <button class="close" data-close></button>
    <h3>Comments <span id="commentCount" style="opacity:.6;font-size:14px"></span></h3>
    <div id="commentsList"></div>
    <div class="comment-input">
      <input type="text" id="commentInput" placeholder="Add a comment..." />
      <button id="btnSendComment">Send</button>
    </div>
  </div>
</div>

<!-- Share Modal -->
<div class="modal" id="shareModal">
  <div class="sheet">
    <button class="close" data-close>✕</button>
    <h3>Share Video</h3>
    <div class="share-options">
      <button class="share-opt" data-share="whatsapp"><div class="s-ico">💬</div><div>WhatsApp</div></button>
      <button class="share-opt" data-share="instagram"><div class="s-ico">📷</div><div>Instagram</div></button>
      <button class="share-opt" data-share="twitter"><div class="s-ico">🐦</div><div>Twitter</div></button>
      <button class="share-opt" data-share="facebook"><div class="s-ico">👥</div><div>Facebook</div></button>
      <button class="share-opt" data-share="copy"><div class="s-ico">🔗</div><div>Copy Link</div></button>
      <button class="share-opt" data-share="download"><div class="s-ico">⬇️</div><div>Download</div></button>
      <button class="share-opt" data-share="report"><div class="s-ico">⚠️</div><div>Report</div></button>
      <button class="share-opt" data-share="more"><div class="s-ico">•••</div><div>More</div></button>
    </div>
  </div>
</div>

<!-- Remix Modal -->
<div class="modal" id="remixModal">
  <div class="sheet">
    <button class="close" data-close>✕</button>
    <h3>Remix Video</h3>
    <div class="remix-opts">
      <button class="remix-opt" id="btnRemixAudio"><div class="r-ico"></div><div>Use Audio</div></button>
      <button class="remix-opt" id="btnRemixVideo"><div class="r-ico">🎬</div><div>Duet</div></button>
      <button class="remix-opt" id="btnRemixStitch"><div class="r-ico">✂️</div><div>Stitch</div></button>
    </div>
  </div>
</div>

<!-- User Modal -->
<div class="modal" id="userModal">
  <div class="sheet">
    <button class="close" data-close></button>
    <div id="userContent"></div>
  </div>
</div>

<!-- Login Modal -->
<div class="modal" id="loginModal">
  <div class="sheet">
    <button class="close" data-close></button>
    <h3>Welcome to Sarwai One</h3>
    <div class="login-form">
      <input type="text" id="loginUsername" placeholder="Username" />
      <input type="email" id="loginEmail" placeholder="Email" />
      <input type="password" id="loginPassword" placeholder="Password" />
      <button id="btnLogin">Login / Sign Up</button>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal" id="settingsModal">
  <div class="sheet">
    <button class="close" data-close>✕</button>
    <h3>Settings</h3>
    <div class="setting-item"><span>Video Quality</span><span id="currentQ">Auto</span></div>
    <div class="quality-grid" id="qualityGrid">
      <button class="q-btn active" data-q="auto">Auto</button>
      <button class="q-btn" data-q="1080">1080p</button>
      <button class="q-btn" data-q="720">720p</button>
      <button class="q-btn" data-q="480">480p</button>
    </div>
    <div class="setting-item"><span>Data Saver</span><button id="dataSaverBtn" style="color:#888;font-weight:700">OFF</button></div>
    <div class="setting-item"><span>Auto-Fill Landscape</span><button id="autoFillBtn" style="color:#888;font-weight:700">OFF</button></div>
    <div class="setting-item"><span>Cache Size</span><span id="cacheSize">0 items</span></div>
    <div class="setting-item"><span>Clear Cache</span><button id="clearCache" style="color:#ff2d55;font-weight:700">Clear</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

// State Management
const state={
  liked:JSON.parse(localStorage.getItem('liked')||'{}'),
  followed:JSON.parse(localStorage.getItem('followed')||'{}'),
  quality:localStorage.getItem('quality')||'auto',
  dataSaver:localStorage.getItem('dataSaver')==='true',
  user:JSON.parse(localStorage.getItem('user')||'null'),
  searchTab:'all',
  autoFill:false,
  fillMode:false,
  currentVideoId:null,
  soundOn:false,
  uploadedVideos:JSON.parse(localStorage.getItem('uploadedVideos')||'[]'),
  comments:JSON.parse(localStorage.getItem('comments')||'{}'),
  playbackSpeed:1.0,
  lastTap:0
};

const feed=document.getElementById('feed');
const bottomNav=document.getElementById('bottomNav');

// Utility Functions
function fmt(n){if(n>=1e6)return(n/1e6).toFixed(1)+"M";if(n>=1e3)return(n/1e3).toFixed(1)+"K";return n}
function timeAgo(date){const seconds=Math.floor((new Date()-new Date(date))/1000);if(seconds<60)return seconds+"s ago";if(seconds<3600)return Math.floor(seconds/60)+"m ago";if(seconds<86400)return Math.floor(seconds/3600)+"h ago";return Math.floor(seconds/86400)+"d ago"}

// Hardware Volume Detection
function setupHardwareVolumeDetection(){
  let lastVolume=1.0;
  feed.querySelectorAll('.video-item video').forEach(video=>{
    video.addEventListener('volumechange',function(){
      if(!state.soundOn&&this.volume>0&&lastVolume!==this.volume){
        state.soundOn=true;
        localStorage.setItem('soundOn',state.soundOn);
        this.muted=false;
        updateSoundButtonsUI();
        toast("🔊 Sound ON");
      }
      lastVolume=this.volume;
    });
  });
}

// Sound Toggle
function toggleSound(){
  state.soundOn=!state.soundOn;
  localStorage.setItem('soundOn',state.soundOn);
  feed.querySelectorAll('.video-item video').forEach(v=>{
    v.muted=!state.soundOn;
    if(state.soundOn){
      v.volume=1.0;
      if(v.paused)v.play().catch(()=>{});
    }
  });
  updateSoundButtonsUI();
  toast(state.soundOn?"🔊 Sound ON":"🔇 Sound OFF");
}

function updateSoundButtonsUI(){
  feed.querySelectorAll('.act.sound-btn').forEach(btn=>{
    if(state.soundOn){
      btn.classList.remove('sound-off');
      btn.classList.add('sound-on');
      btn.querySelector('.ico').textContent='🔊';
      btn.querySelector('.count').textContent='ON';
    }else{
      btn.classList.remove('sound-on');
      btn.classList.add('sound-off');
      btn.querySelector('.ico').textContent='🔇';
      btn.querySelector('.count').textContent='OFF';
    }
  });
}

// Navigation Auto-Hide
let navHideTimer=null;
function startNavHide(){clearTimeout(navHideTimer);navHideTimer=setTimeout(()=>{bottomNav.classList.add('nav-hidden')},3000);}
function showNavTemp(){if(!state.fillMode)return;bottomNav.classList.remove('nav-hidden');startNavHide();}
function enableAutoHide(){state.fillMode=true;bottomNav.classList.remove('nav-hidden');startNavHide();document.addEventListener('click',showNavTemp);document.addEventListener('touchstart',showNavTemp);}
function disableAutoHide(){state.fillMode=false;clearTimeout(navHideTimer);bottomNav.classList.remove('nav-hidden');document.removeEventListener('click',showNavTemp);document.removeEventListener('touchstart',showNavTemp);}

// Render Feed
function renderFeed(){
  const allVideos=[...state.uploadedVideos,...VIDEOS];
  
  feed.innerHTML=allVideos.map((v,i)=>`<div class="video-item" data-id="${v.id}" data-idx="${i}">
    <div class="loader"><div class="spinner"></div><div class="loader-text">Loading...</div></div>
    <video src="${v.sources?v.sources[0]:v.url}" loop playsinline webkit-playsinline preload="auto" crossorigin="anonymous"></video>
    <div class="overlay"></div>
    <div class="progress-bar"><div class="progress-fill" id="progress-${v.id}"></div></div>
    <div class="play-ind"><div class="ring">▶</div></div>
    <div class="double-tap-heart">❤️</div>
    <div class="v-controls">
      <button class="speed-btn" id="speed-${v.id}" data-vid="${v.id}">${state.playbackSpeed}x</button>
      <button class="v-fill-btn" id="fill-${v.id}" data-vid="${v.id}">⛶ Fill</button>
    </div>
    <div class="side-actions">
      <button class="act like ${state.liked[v.id]?'liked':''}" data-act="like">
        <div class="ico">${state.liked[v.id]?'❤️':'🤍'}</div>
        <span class="count">${fmt(v.likes+(state.liked[v.id]?1:0))}</span>
      </button>
      <button class="act" data-act="comment">
        <div class="ico">💬</div>
        <span class="count">${fmt(v.comments)}</span>
      </button>
      <button class="act" data-act="share">
        <div class="ico">↗️</div>
        <span class="count">${fmt(v.shares||0)}</span>
      </button>
      <button class="act sound-btn ${state.soundOn?'sound-on':'sound-off'}" data-act="sound">
        <div class="ico">${state.soundOn?'🔊':'🔇'}</div>
        <span class="count">${state.soundOn?'ON':'OFF'}</span>
      </button>
      <button class="act" data-act="remix">
        <div class="ico">♻️</div>
      </button>
    </div>
    <div class="bottom-info">
      <div class="user">${v.user} ${v.verified?'<span class="verified">✓</span>':''}</div>
      <div class="title">${v.title}</div>
      <div class="music"><span class="music-icon">🎵</span> ${v.music||'Original Sound'}</div>
    </div>
  </div>`).join('');
  
  // Intersection Observer for Auto-Play
  const observer=new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      const video=entry.target.querySelector('video');
      const playInd=entry.target.querySelector('.play-ind');
      const id=+entry.target.dataset.id;
      const progressBar=document.getElementById('progress-'+id);
      
      if(entry.isIntersecting){
        video.muted=!state.soundOn;
        video.volume=1.0;
        video.playbackRate=state.playbackSpeed;
        
        const playPromise=video.play();
        if(playPromise!==undefined){
          playPromise.catch(error=>{
            console.log("Autoplay prevented:",error);
            playInd.querySelector('.ring').textContent='▶';
            playInd.classList.add('show');
            setTimeout(()=>playInd.classList.remove('show'),1500);
          });
        }
        
        // Update progress bar
        video.addEventListener('timeupdate',()=>{
          if(video.duration){
            const progress=(video.currentTime/video.duration)*100;
            if(progressBar)progressBar.style.width=progress+'%';
          }
        });
      }else{
        video.pause();
        video.currentTime=0;
        if(progressBar)progressBar.style.width='0%';
      }
    });
  },{threshold:0.6});

  // Video Event Handlers
  feed.querySelectorAll('.video-item').forEach((el,idx)=>{
    const video=el.querySelector('video'),loader=el.querySelector('.loader'),playInd=el.querySelector('.play-ind'),doubleTapHeart=el.querySelector('.double-tap-heart'),id=+el.dataset.id;
    let retryCount=0,maxRetries=3,loadTimeout;
    const v=allVideos.find(x=>x.id===id);
    
    video.muted=!state.soundOn;
    video.volume=1.0;
    video.playbackRate=state.playbackSpeed;
    observer.observe(el);
    
    // Auto-retry with different sources
    function tryNextSource(){
      if(!v||!v.sources)return;
      retryCount++;
      if(retryCount<v.sources.length){
        const nextSource=v.sources[retryCount];
        video.src=nextSource;
        video.load();
        loader.querySelector('.loader-text').textContent=`Retry ${retryCount}/${v.sources.length}...`;
        loader.style.display='flex';
      }else{
        loader.querySelector('.loader-text').textContent='Tap to retry';
        el.onclick=(e)=>{
          if(e.target.closest('.side-actions')||e.target.closest('.bottom-info')||e.target.closest('.v-controls'))return;
          retryCount=0;
          video.src=v.sources[0];
          video.load();
          loader.querySelector('.loader-text').textContent='Loading...';
          loader.style.display='flex';
        };
      }
    }
    
    loadTimeout=setTimeout(()=>{
      if(loader.style.display!=='none')tryNextSource();
    },8000);
    
    video.addEventListener('loadeddata',()=>{
      clearTimeout(loadTimeout);
      loader.style.display='none';
      if(idx===0){
        video.muted=!state.soundOn;
        video.play().catch(()=>{
          playInd.querySelector('.ring').textContent='▶';
          playInd.classList.add('show');
          setTimeout(()=>playInd.classList.remove('show'),1500);
        });
      }
    });
    
    video.addEventListener('waiting',()=>{loader.style.display='flex';clearTimeout(loadTimeout)});
    video.addEventListener('playing',()=>{loader.style.display='none';clearTimeout(loadTimeout);playInd.classList.remove('show')});
    video.addEventListener('canplay',()=>{loader.style.display='none';clearTimeout(loadTimeout)});
    video.addEventListener('error',()=>{
      clearTimeout(loadTimeout);
      console.log('Video error, trying next source...');
      tryNextSource();
    });
    
    // Double-tap to like
    el.addEventListener('click',e=>{
      if(e.target.closest('.side-actions')||e.target.closest('.bottom-info')||e.target.closest('.v-controls'))return;
      
      const now=Date.now();
      if(now-state.lastTap<300){
        // Double tap - like
        if(!state.liked[id]){
          state.liked[id]=true;
          localStorage.setItem('liked',JSON.stringify(state.liked));
          const likeBtn=el.querySelector('.act.like');
          likeBtn.classList.add('liked');
          likeBtn.querySelector('.ico').textContent='❤️';
          let count=v.likes+1;
          likeBtn.querySelector('.count').textContent=fmt(count);
        }
        doubleTapHeart.classList.add('show');
        setTimeout(()=>doubleTapHeart.classList.remove('show'),800);
      }else{
        // Single tap - play/pause
        setTimeout(()=>{
          if(Date.now()-state.lastTap>=300){
            if(video.paused){
              video.play().catch(()=>{});
              playInd.classList.remove('show');
            }else{
              video.pause();
              playInd.querySelector('.ring').textContent='▶';
              playInd.classList.add('show');
              setTimeout(()=>playInd.classList.remove('show'),500);
            }
          }
        },300);
      }
      state.lastTap=now;
    });
  });
  
  // Fill Button
  feed.querySelectorAll('.v-fill-btn').forEach(btn=>{
    btn.addEventListener('click',function(e){
      e.stopPropagation();e.preventDefault();
      const vid=+this.dataset.vid;
      const el=feed.querySelector(`.video-item[data-id="${vid}"]`);
      const video=el.querySelector('video');
      const isFilled=video.classList.contains('fit-cover');
      if(isFilled){
        video.classList.remove('fit-cover');
        this.textContent='⛶ Fill';
        this.classList.remove('active');
        disableAutoHide();
        toast("Fill OFF");
      }else{
        video.classList.add('fit-cover');
        this.textContent='⛶ Filled';
        this.classList.add('active');
        enableAutoHide();
        toast("Fill ON");
      }
    });
  });
  
  // Speed Button
  feed.querySelectorAll('.speed-btn').forEach(btn=>{
    btn.addEventListener('click',function(e){
      e.stopPropagation();
      const speeds=[0.5,1.0,1.5,2.0];
      const currentIdx=speeds.indexOf(state.playbackSpeed);
      const nextIdx=(currentIdx+1)%speeds.length;
      state.playbackSpeed=speeds[nextIdx];
      this.textContent=state.playbackSpeed+'x';
      feed.querySelectorAll('video').forEach(v=>v.playbackRate=state.playbackSpeed);
      toast("Speed: "+state.playbackSpeed+"x");
    });
  });
  
  // Side Actions
  feed.addEventListener('click',e=>{
    const btn=e.target.closest('.act');
    if(!btn)return;
    const id=+btn.closest('.video-item').dataset.id;
    const v=allVideos.find(x=>x.id===id);
    const action=btn.dataset.act;
    
    if(action==='sound')toggleSound();
    else if(action==='like'){
      state.liked[id]=!state.liked[id];
      localStorage.setItem('liked',JSON.stringify(state.liked));
      btn.classList.toggle('liked');
      btn.querySelector('.ico').textContent=state.liked[id]?'❤️':'🤍';
      let count=v.likes;
      if(state.liked[id])count++;
      btn.querySelector('.count').textContent=fmt(count);
    }else if(action==='comment'){
      openComments(id);
    }else if(action==='share'){
      openShare(id);
    }else if(action==='remix'){
      document.getElementById('remixModal').classList.add('open');
    }
  });
  
  setupHardwareVolumeDetection();
}

// Comments System
let currentCommentVideoId=null;
function openComments(videoId){
  currentCommentVideoId=videoId;
  const comments=state.comments[videoId]||[];
  document.getElementById('commentCount').textContent='('+comments.length+')';
  
  const commentsList=document.getElementById('commentsList');
  if(comments.length===0){
    commentsList.innerHTML='<div style="text-align:center;padding:40px;opacity:.5">No comments yet. Be the first!</div>';
  }else{
    commentsList.innerHTML=comments.map(c=>`
      <div class="comment-item">
        <div class="avatar">${c.user.charAt(0).toUpperCase()}</div>
        <div class="content">
          <div class="user">${c.user}</div>
          <div class="text">${c.text}</div>
          <div class="time">${timeAgo(c.time)}</div>
        </div>
      </div>
    `).join('');
  }
  
  document.getElementById('commentsModal').classList.add('open');
}

document.getElementById('btnSendComment').addEventListener('click',()=>{
  const input=document.getElementById('commentInput');
  const text=input.value.trim();
  if(!text||!currentCommentVideoId)return;
  
  if(!state.comments[currentCommentVideoId])state.comments[currentCommentVideoId]=[];
  state.comments[currentCommentVideoId].push({
    user:state.user?state.user.username:'Guest',
    text:text,
    time:new Date().toISOString()
  });
  
  localStorage.setItem('comments',JSON.stringify(state.comments));
  input.value='';
  openComments(currentCommentVideoId);
  toast("Comment added!");
});

// Share System
let currentShareVideoId=null;
function openShare(videoId){
  currentShareVideoId=videoId;
  document.getElementById('shareModal').classList.add('open');
}

document.querySelectorAll('.share-opt').forEach(btn=>{
  btn.addEventListener('click',function(){
    const shareType=this.dataset.share;
    const v=VIDEOS.find(x=>x.id===currentShareVideoId)||state.uploadedVideos.find(x=>x.id===currentShareVideoId);
    
    if(shareType==='copy'){
      navigator.clipboard.writeText(v.sources?v.sources[0]:v.url).then(()=>toast("Link copied!"));
    }else if(shareType==='download'){
      toast("Download started...");
    }else if(shareType==='report'){
      toast("Report submitted. Thank you!");
    }else if(shareType==='more'){
      if(navigator.share){
        navigator.share({title:v.title,text:v.user,url:v.sources?v.sources[0]:v.url}).catch(()=>{});
      }
    }else{
      toast("Shared to "+shareType);
    }
    document.getElementById('shareModal').classList.remove('open');
  });
});

  }

});

  toast("Data Saver "+(state.dataSaver?'ON':'OFF'));
});

document.getElementById('autoFillBtn').addEventListener('click',function(){
  state.autoFill=!state.autoFill;
  this.textContent=state.autoFill?'ON':'OFF';
  this.style.color=state.autoFill?'#ff2d55':'#888';
  toast("Auto-Fill "+(state.autoFill?'ON':'OFF'));
});

// Top Bar Tabs
document.querySelectorAll('.topbar .tab-btn').forEach(btn=>{
  btn.addEventListener('click',function(){
    document.querySelectorAll('.topbar .tab-btn').forEach(b=>b.classList.remove('active'));
    this.classList.add('active');
    toast(this.textContent+" feed");
  });
});
</script>
</body>
</html>
