<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>लाइव वीडियो और टेक्स्ट चैट</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .video-section {
            position: relative;
            background: #111;
            width: 100%;
            aspect-ratio: 4/3;
            overflow: hidden;
            flex-shrink: 0;
        }

        .video-box.remote-box {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* 'आप' (Local) कैमरा बाईं तरफ स्थिर */
        .video-box.local-box {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 90px;
            height: 120px;
            border-radius: 6px;
            border: 2px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 10;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-label {
            position: absolute;
            bottom: 5px;
            left: 5px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            z-index: 12;
        }

        .controls {
            text-align: center;
            padding: 10px;
            background: #f8f9fa;
            border-bottom: 1px solid #ddd;
            flex-shrink: 0;
        }

        #startBtn {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        #startBtn:hover {
            background: #218838;
        }

        .text-chat-section {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            min-height: 0;
            background: #fff;
        }

        .chat-window {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            padding: 8px 12px;
            border-radius: 8px;
            max-width: 75%;
            font-size: 14px;
            word-wrap: break-word; /* लंबा टेक्स्ट होने पर लाइन टूटेगी */
        }

        .message.system {
            background: #e9ecef;
            color: #6c757d;
            align-self: center;
            font-style: italic;
        }

        .message.you {
            background: #007bff;
            color: white;
            align-self: flex-end;
        }

        .message.stranger {
            background: #e4e6eb;
            color: black;
            align-self: flex-start;
        }

        .input-area {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ddd;
            gap: 10px;
            background: #fff;
            flex-shrink: 0;
        }

        #messageInput {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
        }

        #sendBtn {
            background: #007bff;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        #sendBtn:disabled, #messageInput:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .modal-box p {
            margin-bottom: 20px;
            font-size: 16px;
            color: #333;
        }

        .modal-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="video-section">
            <div class="video-box local-box">
                <video id="localVideo" autoplay playsinline muted></video>
                <div class="video-label">आप</div>
            </div>
            <div class="video-box remote-box">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="video-label">सामने वाला</div>
            </div>
        </div>

        <div class="controls">
            <button id="startBtn">कैमरा शुरू करें</button>
        </div>

        <div class="text-chat-section">
            <div class="chat-window" id="chatWindow">
                <div class="message system">सिस्टम: चैट शुरू करने के लिए कैमरा चालू करें।</div>
            </div>
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="अपना संदेश टाइप करें..." disabled>
                <button id="sendBtn" disabled>भेजें</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="permissionModal">
        <div class="modal-box">
            <p><strong>चैट करने के लिए कैमरा और माइक की अनुमति आवश्यक है।</strong> <br><br> कृपया ब्राउज़र के ऊपरी हिस्से में आने वाले पॉपअप पर 'Allow/अनुमति' पर क्लिक करें।</p>
            <button class="modal-btn" id="modalOkBtn">हाँ, अनुमति दें</button>
        </div>
    </div>

    <script>
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const startBtn = document.getElementById('startBtn');
        const sendBtn = document.getElementById('sendBtn');
        const messageInput = document.getElementById('messageInput');
        const chatWindow = document.getElementById('chatWindow');
        const permissionModal = document.getElementById('permissionModal');
        const modalOkBtn = document.getElementById('modalOkBtn');

        let localStream;

        // मोबाइल कीबोर्ड खुलने पर इनपुट बॉक्स को स्क्रीन पर सही दिखाना
        messageInput.addEventListener('focus', () => {
            setTimeout(() => {
                messageInput.scrollIntoView({ behavior: 'smooth', block: 'end' });
            }, 300);
        });

        // संदेश भेजने का नया और मुख्य फंक्शन (Fix Added)
        function sendMessage() {
            const text = messageInput.value.trim();
            if (text === "") return; // खाली मैसेज सेंड नहीं होगा

            // 1. स्क्रीन पर आपका मैसेज जोड़ना
            let msgDiv = document.createElement('div');
            msgDiv.className = "message you";
            msgDiv.innerText = "आप: " + text;
            chatWindow.appendChild(msgDiv);

            // 2. इनपुट बॉक्स को खाली करना और फोकस बनाए रखना
            messageInput.value = "";
            messageInput.focus();

            // 3. नया मैसेज आने पर चैट विंडो को ऑटोमैटिक नीचे स्क्रॉल करना
            chatWindow.scrollTop = chatWindow.scrollHeight;

            /* 
               नोट: यदि आप WebRTC या Socket.io का उपयोग कर रहे हैं, 
               तो सामने वाले को मैसेज भेजने का कोड यहाँ आएगा, जैसे:
               dataChannel.send(text); 
            */
        }

        // भेजें बटन पर क्लिक करने पर
        sendBtn.addEventListener('click', sendMessage);

        // कीबोर्ड का 'Enter' बटन दबाने पर भी मैसेज सेंड होगा
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        async function openCamera() {
            permissionModal.style.display = 'none';
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: {
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        facingMode: "user"
                    }, 
                    audio: true 
                });
                
                localVideo.srcObject = localStream;
                remoteVideo.srcObject = localStream;
                
                messageInput.disabled = false;
                sendBtn.disabled = false;
                
                let msg = document.createElement('div');
                msg.className = "message system";
                msg.innerText = "कैमरा कनेक्ट हो गया है! अब वीडियो साफ़ और बड़ा दिखेगा।";
                chatWindow.appendChild(msg);
                chatWindow.scrollTop = chatWindow.scrollHeight;
