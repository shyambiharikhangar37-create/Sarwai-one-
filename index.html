<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<meta name="theme-color" content="#000" />
<title>Sarwai One - Modern Video Platform</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
button{background:none;border:none;color:inherit;cursor:pointer;font:inherit}
input,textarea{font:inherit;outline:none;border:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:#000}

/* ===== Cinematic Landscape Mode Styles ===== */
body.cinematic-mode #app {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: #000;
}

body.cinematic-mode .feed {
  overflow: hidden;
}

body.cinematic-mode .video-item {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  z-index: 10000;
}

body.cinematic-mode .video-item video {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

body.cinematic-mode .video-item video.fit-cover {
  object-fit: cover;
}

body.cinematic-mode .topbar,
body.cinematic-mode .bottomnav,
body.cinematic-mode .side-actions,
body.cinematic-mode .v-controls,
body.cinematic-mode .bottom-info,
body.cinematic-mode .progress-bar,
body.cinematic-mode .cinematic-description {
  transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Navigation hidden state */
body.cinematic-mode.nav-hidden .bottomnav {
  transform: translateY(100%);
  opacity: 0;
  pointer-events: none;
}

/* Controls hidden state (after 7 seconds) */
body.cinematic-mode.controls-hidden .topbar,
body.cinematic-mode.controls-hidden .side-actions,
body.cinematic-mode.controls-hidden .v-controls,
body.cinematic-mode.controls-hidden .progress-bar {
  opacity: 0;
  pointer-events: none;
  transform: translateY(-10px);
}

body.cinematic-mode.controls-hidden .bottom-info {
  opacity: 0;
  pointer-events: none;
  transform: translateY(20px);
}

body.cinematic-mode.controls-hidden .cinematic-description {
  opacity: 0;
  pointer-events: none;
  transform: translateY(20px);
}

/* Cinematic Description Overlay */
.cinematic-description {
  position: absolute;
  left: 20px;
  right: 20px;
  bottom: 80px;
  background: linear-gradient(180deg, rgba(0,0,0,0.5), rgba(0,0,0,0.85));
  padding: 18px 20px;
  border-radius: 14px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.1);
  z-index: 15;
  opacity: 0;
  pointer-events: none;
  transform: translateY(20px);
  max-height: 50vh;
  overflow-y: auto;
  box-shadow: 0 8px 32px rgba(0,0,0,0.6);
}

body.cinematic-mode.show-description .cinematic-description {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
}

.cinematic-description .cin-title {
  font-weight: 700;
  font-size: 16px;
  margin-bottom: 8px;
  color: #fff;
  line-height: 1.3;
}

.cinematic-description .cin-desc {
  font-size: 13px;
  opacity: 0.9;
  line-height: 1.55;
  color: #fff;
  margin-bottom: 12px;
}

.cinematic-description .cin-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  opacity: 0.75;
  padding-top: 10px;
  border-top: 1px solid rgba(255,255,255,0.1);
}

.cinematic-description .cin-music-icon {
  animation: spin 3s linear infinite;
}

/* Exit button for cinematic mode */
.cinematic-exit {
  position: absolute;
  top: 16px;
  right: 16px;
  z-index: 30;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.3s;
  color: #fff;
}

body.cinematic-mode:not(.controls-hidden) .cinematic-exit {
  opacity: 1;
}

.cinematic-exit:active {
  transform: scale(0.9);
  background: rgba(0,0,0,0.8);
}

/* Hint indicator */
.cinematic-hint {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.7);
  padding: 12px 20px;
  border-radius: 24px;
  font-size: 13px;
  color: #fff;
  opacity: 0;
  pointer-events: none;
  z-index: 25;
  backdrop-filter: blur(10px);
  transition: opacity 0.4s;
  border: 1px solid rgba(255,255,255,0.15);
}

.cinematic-hint.show {
  opacity: 1;
}

/* Original styles continue... */
.topbar{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:linear-gradient(180deg,rgba(0,0,0,.9),transparent);pointer-events:none}
.topbar .logo-container{display:flex;align-items:center;gap:8px;pointer-events:auto}
.sarwai-logo{width:34px;height:35px;border-radius:6px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 2px 8px rgba(0,0,0,0.4);flex-shrink:0}
.sarwai-logo .red-part{height:45%;background:#D32F2F;display:flex;align-items:center;justify-content:center;padding:4px;box-sizing:border-box}
.sarwai-logo .red-part span{color:#fff;font-weight:900;font-size:7.5px;letter-spacing:0.5px;line-height:1;text-transform:uppercase}
.sarwai-logo .blue-part{height:55%;background:#1565C0;display:flex;align-items:center;justify-content:center}
.sarwai-logo .play-icon{width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:8px solid #fff;margin-left:2px}
.topbar .one-text{font-size:20px;font-weight:900;background:linear-gradient(90deg,#ff0000,#ff2d55,#0044ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:1px}
.topbar .tabs{display:flex;gap:20px;pointer-events:auto}
.topbar .tab-btn{font-size:15px;font-weight:600;opacity:.6;transition:opacity .2s}
.topbar .tab-btn.active{opacity:1}

.feed{flex:1;overflow-y:scroll;overflow-x:hidden;scroll-snap-type:y mandatory;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.video-item{position:relative;width:100%;height:100vh;scroll-snap-align:start;scroll-snap-stop:always;background:#000}
.video-item video{width:100%;height:100%;object-fit:contain;background:#000;transition:all .3s}
.video-item video.fit-cover{object-fit:cover}
.overlay{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.4) 0%,transparent 30%,transparent 60%,rgba(0,0,0,.8) 100%)}

.progress-bar{position:absolute;bottom:64px;left:0;right:0;height:3px;background:rgba(255,255,255,.2);z-index:15}
.progress-fill{height:100%;background:#ff2d55;width:0;transition:width .1s linear}

.v-controls{position:absolute;bottom:80px;left:14px;right:80px;z-index:12;display:flex;align-items:center;gap:10px;pointer-events:auto}
.v-fill-btn{padding:8px 16px;border-radius:20px;background:rgba(255,45,85,.95);font-size:13px;font-weight:700;color:#fff;display:flex;align-items:center;gap:5px;border:2px solid rgba(255,255,255,.2)}
.v-fill-btn:active{transform:scale(.95)}
.v-fill-btn.active{background:rgba(255,255,255,.25);border-color:#ff2d55}
.speed-btn{padding:8px 12px;border-radius:20px;background:rgba(255,255,255,.2);font-size:12px;font-weight:700;color:#fff;backdrop-filter:blur(10px)}

.side-actions{position:absolute;right:12px;bottom:120px;display:flex;flex-direction:column;gap:20px;pointer-events:auto;z-index:10}
.side-actions .act{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:600;cursor:pointer}
.side-actions .act .ico{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;transition:transform .2s;text-shadow:0 2px 4px rgba(0,0,0,0.5)}
.side-actions .act:active .ico{transform:scale(.9)}
.side-actions .act.liked .ico{color:#ff2d55;animation:likeAnim .5s}
@keyframes likeAnim{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
.side-actions .act.sound-on .ico{color:#00ff88}
.side-actions .act.sound-off .ico{color:#ff4444}

.share-svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5))}

.bottom-info{position:absolute;left:14px;right:80px;bottom:120px;pointer-events:auto;z-index:10}
.bottom-info .user{font-weight:700;margin-bottom:6px;font-size:15px;display:flex;align-items:center;gap:6px}
.bottom-info .user .verified{color:#00d4ff;font-size:14px}
.bottom-info .title{font-size:14px;line-height:1.35;opacity:.95;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:8px}
.bottom-info .music{font-size:12px;opacity:.85;display:flex;align-items:center;gap:6px}
.bottom-info .music .music-icon{animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.play-ind{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .25s;z-index:8}
.play-ind.show{opacity:1}
.play-ind .ring{width:80px;height:80px;border-radius:50%;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;font-size:36px}

.double-tap-heart{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:100px;pointer-events:none;z-index:9;opacity:0}
.double-tap-heart.show{animation:heartPop .8s ease-out}
@keyframes heartPop{0%{transform:translate(-50%,-50%) scale(0);opacity:0}50%{transform:translate(-50%,-50%) scale(1.2);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}

.loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;z-index:5;gap:12px}
.spinner{width:44px;height:44px;border:3px solid #333;border-top-color:#ff2d55;border-radius:50%;animation:spin 1s linear infinite}
.loader-text{font-size:12px;opacity:.6}

.bottomnav{position:absolute;left:0;right:0;bottom:0;z-index:25;height:64px;display:flex;align-items:center;justify-content:space-around;background:rgba(10,10,10,.97);border-top:1px solid rgba(255,255,255,.08);backdrop-filter:blur(10px);transition:transform .35s ease}
.bottomnav.nav-hidden{transform:translateY(100%)}
.nav-btn{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;opacity:.7}
.nav-btn.active{opacity:1;color:#ff2d55}
.nav-btn .n-ico{font-size:24px;line-height:1}
.nav-btn.upload .n-ico{width:46px;height:32px;border-radius:8px;background:linear-gradient(135deg,#ff2d55,#ff9500);display:flex;align-items:center;justify-content:center;position:relative}
.nav-btn.upload .n-ico::before,.nav-btn.upload .n-ico::after{content:"";position:absolute;width:30px;height:24px;border-radius:6px;background:#fff;mix-blend-mode:difference}
.nav-btn.upload .n-ico::before{transform:translateX(-4px)}
.nav-btn.upload .n-ico::after{transform:translateX(4px)}
.nav-btn.upload .n-ico span{position:relative;z-index:2;font-size:18px;color:#000;font-weight:900}

.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:500px;background:#141414;border-radius:18px 18px 0 0;padding:18px;max-height:85vh;overflow-y:auto;animation:slide .25s}
@keyframes slide{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet h3{margin-bottom:14px;font-size:17px}
.sheet .close{float:right;font-size:22px;opacity:.7;cursor:pointer}

.search-box{display:flex;gap:8px;margin-bottom:12px}
.search-box input{flex:1;background:#222;color:#fff;padding:12px 14px;border-radius:10px;font-size:14px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{padding:7px 14px;border-radius:20px;background:#222;font-size:13px;cursor:pointer}
.tab.active{background:#ff2d55}
.search-result{padding:12px;border-bottom:1px solid #222;display:flex;align-items:center;gap:12px;cursor:pointer}
.search-result:active{background:#222}
.search-result .thumb{width:60px;height:80px;border-radius:8px;background:#333;flex-shrink:0}
.search-result .info{flex:1}
.search-result .info .title{font-weight:600;margin-bottom:4px}
.search-result .info .user{font-size:12px;opacity:.6}

.upload-opts{display:flex;gap:14px;justify-content:center;margin-top:10px}
.upload-opt{width:120px;height:120px;border-radius:14px;background:#222;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:13px;cursor:pointer}
.upload-opt:active{background:#333}
.upload-opt .u-ico{font-size:32px}
.upload-form{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.upload-form input,.upload-form textarea{background:#222;color:#fff;padding:12px 14px;border-radius:10px;font-size:14px}
.upload-form textarea{min-height:80px;resize:vertical}
.upload-form button{padding:12px;border-radius:10px;background:#ff2d55;font-weight:700;color:#fff;cursor:pointer}
.upload-preview{width:100%;max-height:200px;border-radius:10px;background:#222;display:flex;align-items:center;justify-content:center;overflow:hidden}
.upload-preview video{width:100%;height:100%;object-fit:contain}

.comp-ui{background:#1a1a1a;padding:14px;border-radius:12px;margin-top:14px;border:1px solid #222}
.comp-header{display:flex;justify-content:space-between;font-size:13px;margin-bottom:12px;color:#aaa}
.comp-header b{color:#fff}
.q-opts{display:flex;gap:8px;margin-bottom:12px}
.q-opt{flex:1;padding:10px;background:#222;border:1px solid #333;border-radius:8px;color:#fff;font-size:12px;cursor:pointer;transition:all .2s;text-align:center}
.q-opt.active{border-color:#ff2d55;color:#ff2d55;background:#2a1519}
.btn-compress{width:100%;padding:12px;background:#ff9500;border-radius:10px;font-weight:700;color:#000;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .2s}
.btn-compress:disabled{opacity:.6;cursor:not-allowed}
.comp-progress{margin-top:12px;display:none}
.comp-bar-bg{height:6px;background:#333;border-radius:3px;overflow:hidden;margin-bottom:8px}
.comp-bar-fill{height:100%;width:0%;background:linear-gradient(90deg,#ff2d55,#ff9500);transition:width .3s}
.comp-text{font-size:12px;text-align:center;opacity:.8}
.comp-result{text-align:center;margin-top:12px;color:#00ff88;font-size:13px;font-weight:700;display:none}

.user-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #222}
.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#ff2d55,#ff9500);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
.profile-stats{display:flex;gap:20px;margin:14px 0}
.profile-stats .stat{text-align:center}
.profile-stats .stat .num{font-size:18px;font-weight:700}
.profile-stats .stat .label{font-size:11px;opacity:.6}
.login-btn,.logout-btn{width:100%;padding:12px;border-radius:10px;background:#ff2d55;font-weight:700;margin-top:10px;color:#fff;cursor:pointer}
.logout-btn{background:#333}

.setting-item{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #222;font-size:14px;cursor:pointer}
.setting-item:active{opacity:.7}
.quality-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.q-btn{padding:10px;border-radius:8px;background:#222;font-size:13px;font-weight:600;color:#fff;cursor:pointer}
.q-btn.active{background:#ff2d55}

.remix-opts{display:flex;gap:14px;justify-content:center;margin-top:10px}
.remix-opt{width:140px;height:100px;border-radius:14px;background:#222;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:13px;cursor:pointer}
.remix-opt:active{background:#333}
.remix-opt .r-ico{font-size:32px}

.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(0,0,0,.95);padding:10px 18px;border-radius:20px;font-size:13px;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none;border:1px solid rgba(255,255,255,.15)}
.toast.show{opacity:1}
body.cinematic-mode .toast {
  z-index: 10001;
}

.comment-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #222}
.comment-item .avatar{width:36px;height:36px;font-size:14px}
.comment-item .content{flex:1}
.comment-item .content .user{font-weight:600;font-size:13px;margin-bottom:4px}
.comment-item .content .text{font-size:13px;opacity:.9;word-break:break-word}
.comment-item .content .time{font-size:11px;opacity:.5;margin-top:4px}
.comment-input{display:flex;gap:8px;margin-top:14px}
.comment-input input{flex:1;background:#222;color:#fff;padding:12px;border-radius:20px;font-size:14px}
.comment-input button{padding:12px 20px;background:#ff2d55;border-radius:20px;font-weight:700;cursor:pointer}

.share-options{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:14px}
.share-opt{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;cursor:pointer}
.share-opt:active .s-ico{background:#333}
.share-opt .s-ico{width:56px;height:56px;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center;font-size:24px;transition:background .2s}

.pull-indicator{position:absolute;top:0;left:0;right:0;height:60px;display:flex;align-items:center;justify-content:center;transform:translateY(-100%);transition:transform .3s;z-index:5}
.pull-indicator.show{transform:translateY(0)}
.pull-indicator .spinner{width:32px;height:32px}

/* Hide scroll in cinematic mode */
body.cinematic-mode .feed::-webkit-scrollbar {
  display: none;
}
</style>

<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="logo-container">
      <div class="sarwai-logo">
        <div class="red-part"><span>Sarwai</span></div>
        <div class="blue-part"><div class="play-icon"></div></div>
      </div>
      <span class="one-text">one</span>
    </div>
    <div class="tabs">
      <button class="tab-btn active">Following</button>
      <button class="tab-btn">For You</button>
    </div>
  </div>
  
  <div class="pull-indicator" id="pullIndicator">
    <div class="spinner"></div>
  </div>
  
  <div class="feed" id="feed"></div>
  
  <nav class="bottomnav" id="bottomNav">
    <button class="nav-btn active" data-nav="home"><div class="n-ico">🏠</div><div>HOME</div></button>
    <button class="nav-btn" data-nav="search"><div class="n-ico">🔍</div><div>Search</div></button>
    <button class="nav-btn upload" data-nav="upload"><div class="n-ico"><span>+</span></div><div>Upload</div></button>
    <button class="nav-btn" data-nav="inbox"><div class="n-ico">💬</div><div>Inbox</div></button>
    <button class="nav-btn" data-nav="user"><div class="n-ico">👤</div><div>Profile</div></button>
  </nav>
</div>

<div class="modal" id="searchModal">
  <div class="sheet">
    <button class="close" data-close>✕</button>
    <h3>Search</h3>
    <div class="search-box"><input id="searchInput" placeholder="Search videos, creators, hashtags..." /></div>
    <div class="tabs">
      <button class="tab active" data-tab="all">All</button>
      <button class="tab" data-tab="users">Users</button>
      <button class="tab" data-tab="videos">Videos</button>
    </div>
    <div id="searchResults"></div>
  </div>
</div>

<div class="modal" id="uploadModal">
  <div class="sheet">
    <button class="close" data-close>✕</button>
    <h3>Create Video</h3>
    <div class="upload-opts">
      <button class="upload-opt" id="btnCamera"><div class="u-ico">📷</div><div>Camera</div></button>
      <button class="upload-opt" id="btnGallery"><div class="u-ico">🖼️</div><div>Gallery</div></button>
    </div>
    <div id="uploadFormContainer" style="display:none">
      <div class="upload-preview" id="uploadPreview"></div>
      <div class="comp-ui" id="compressionUI" style="display:none">
        <div class="comp-header">
          <span>Original: <b id="origSize">-</b></span>
          <span id="compStatus" style="color:#ff2d55">Ready to compress</span>
        </div>
        <div class="q-opts">
          <button class="q-opt" data-q="high" onclick="setCompQuality('high', this)">High (1080p)</button>
          <button class="q-opt active" data-q="medium" onclick="setCompQuality('medium', this)">Balanced (720p)</button>
          <button class="q-opt" data-q="low" onclick="setCompQuality('low', this)">Data Saver (480p)</button>
        </div>
        <button class="btn-compress" id="btnCompress" onclick="startCompression()">⚡ Compress Video</button>
        <div class="comp-progress" id="compProgress">
          <div class="comp-bar-bg"><div class="comp-bar-fill" id="compBar"></div></div>
          <div class="comp-text" id="compText">Initializing...</div>
        </div>
        <div class="comp-result" id="compResult">✅ Compressed! Saved <span id="savedPercent">0</span>%</div>

<script>
function escapeHTML(str) {
  if (typeof str !== 'string') return '';
  return str.replace(/[&<>"']/g, function(m) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
  });
}
function fmt(n){if(n>=1e6)return(n/1e6).toFixed(1)+"M";if(n>=1e3)return(n/1e3).toFixed(1)+"K";return n}
function timeAgo(date){const seconds=Math.max(0,Math.floor((new Date()-new Date(date))/1000));if(!Number.isFinite(seconds))return '';if(seconds<60)return seconds+"s ago";if(seconds<3600)return Math.floor(seconds/60)+"m ago";if(seconds<86400)return Math.floor(seconds/3600)+"h ago";return Math.floor(seconds/86400)+"d ago"}
function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

// Safe local settings: malformed JSON or a full storage quota must not crash the app.
function readJSON(key, fallback) {
  try { const value = localStorage.getItem(key); return value ? JSON.parse(value) : fallback; }
  catch (error) { console.warn('Invalid local data:', key, error); return fallback; }
}
function writeJSON(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch (error) { console.warn('Could not save local data:', key, error); toast('फोन की स्टोरेज भर गई है; डेटा सेव नहीं हुआ'); return false; }
}

// Local media is stored as a Blob in IndexedDB; object URLs themselves do not survive reloads.
const LOCAL_MEDIA_DB = 'sarwai-one-local-media';
function openLocalMediaDB() {
  return new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) return reject(new Error('IndexedDB is not supported'));
    const request = indexedDB.open(LOCAL_MEDIA_DB, 1);
    request.onupgradeneeded = () => {
      const db = request.result;
      if (!db.objectStoreNames.contains('videos')) db.createObjectStore('videos', { keyPath: 'id' });
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error || new Error('Could not open local media storage'));
  });
}
async function saveLocalMedia(id, blob) {
  const db = await openLocalMediaDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('videos', 'readwrite');
    tx.objectStore('videos').put({ id, blob, type: blob.type || 'video/mp4', savedAt: Date.now() });
    tx.oncomplete = () => { db.close(); resolve(true); };
    tx.onerror = tx.onabort = () => { const err = tx.error || new Error('Could not save video'); db.close(); reject(err); };
  });
}
async function getLocalMedia(id) {
  const db = await openLocalMediaDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('videos', 'readonly');
    const req = tx.objectStore('videos').get(id);
    req.onsuccess = () => { const result = req.result; db.close(); resolve(result || null); };
    req.onerror = () => { const err = req.error; db.close(); reject(err); };
  });
}
function persistUploadedMetadata() {
  const metadata = state.uploadedVideos.map(v => ({ ...v, url: undefined, sources: undefined }));
  return writeJSON('uploadedVideos', metadata);
}
async function restoreLocalMedia() {
  for (const video of state.uploadedVideos) {
    try {
      const stored = await getLocalMedia(video.id);
      if (stored && stored.blob) {
        video.url = URL.createObjectURL(stored.blob);
        video.sources = [video.url];
      }
    } catch (error) { console.warn('Local video could not be restored:', video.id, error); }
  }
  state.uploadedVideos = state.uploadedVideos.filter(v => !!v.url);
  persistUploadedMetadata();
}

const modalHistory = {
  init() {
    window.addEventListener('popstate', () => {
      document.querySelectorAll('.modal.open').forEach(modal => {
        modal.classList.remove('open');
      });
    });
  },
  push(modalId) {
    if (!history.state || !history.state.modal) {
      history.pushState({ modal: modalId }, '');
    } else {
      history.replaceState({ modal: modalId }, '');
    }
  }
};
modalHistory.init();

function openModal(modalId) {
  const modal = document.getElementById(modalId);

const SHARE_ICON_SVG = `<svg class="share-svg" viewBox="0 0 24 24">

// ===== Cinematic Mode Variables =====
let cinematicMode = false;
let cinematicTimers = { nav: null, controls: null, desc: null, hint: null };
let cinematicActiveVideoId = null;

// ===== Cinematic Mode Functions =====
function enableCinematicMode(videoEl, videoData) {
  if (cinematicMode) return;
  cinematicMode = true;
  cinematicActiveVideoId = videoData.id;
  
  // Add cinematic class to body
  document.body.classList.add('cinematic-mode');
  
  // Try to lock orientation to landscape
  try {
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('landscape').catch(e => {
        console.log('Orientation lock not supported:', e.message);
      });
    }
  } catch (e) {
    console.log('Orientation lock error:', e);
  }
  
  // Hide all other video items
  feed.querySelectorAll('.video-item').forEach(item => {
    if (+item.dataset.id !== videoData.id) {
      item.style.display = 'none';
    }
  });
  
  // Add description overlay
  addCinematicDescription(videoData);
  
  // Add exit button
  addCinematicExitButton();
  
  // Show hint
  showCinematicHint('📱 Cinematic Mode • Tap for controls');
  
  // Start auto-hide timers
  startCinematicTimers();
  
  // Show description immediately
  document.body.classList.add('show-description');
  
  // Auto-hide description after 5 seconds
  cinematicTimers.desc = setTimeout(() => {
    if (cinematicMode) {
      document.body.classList.remove('show-description');
    }
  }, 5000);
  
  toast('🎬 Cinematic Mode Activated');
}

function disableCinematicMode() {
  if (!cinematicMode) return;
  cinematicMode = false;
  cinematicActiveVideoId = null;
  
  // Clear all timers
  clearTimeout(cinematicTimers.nav);
  clearTimeout(cinematicTimers.controls);
  clearTimeout(cinematicTimers.desc);
  clearTimeout(cinematicTimers.hint);
  
  // Remove all cinematic classes
  document.body.classList.remove(
    'cinematic-mode',
    'controls-hidden',
    'nav-hidden',
    'show-description'
  );
  
  // Unlock orientation
  try {
    if (screen.orientation && screen.orientation.unlock) {
      screen.orientation.unlock();
    }
  } catch (e) {}
  
  // Show all video items again
  feed.querySelectorAll('.video-item').forEach(item => {
    item.style.display = '';
  });
  
  // Remove description overlay
  const descEl = document.querySelector('.cinematic-description');
  if (descEl) descEl.remove();
  
  // Remove exit button
  const exitEl = document.querySelector('.cinematic-exit');
  if (exitEl) exitEl.remove();
  
  // Remove hint
  const hintEl = document.querySelector('.cinematic-hint');
  if (hintEl) hintEl.remove();
  
  // Reset fill button state
  const fillBtn = document.querySelector('.v-fill-btn.active');
  if (fillBtn) {
    fillBtn.textContent = '⛶ Fill';
    fillBtn.classList.remove('active');
    const videoItem = fillBtn.closest('.video-item');
    if (videoItem) {
      const video = videoItem.querySelector('video');
      if (video) video.classList.remove('fit-cover');
    }
  }
  
  disableAutoHide();
  toast('Cinematic Mode OFF');
}

function startCinematicTimers() {
  clearTimeout(cinematicTimers.nav);
  clearTimeout(cinematicTimers.controls);
  
  // Hide navigation after 3 seconds
  cinematicTimers.nav = setTimeout(() => {
    if (cinematicMode) {
      document.body.classList.add('nav-hidden');
    }
  }, 3000);
  
  // Hide all controls after 7 seconds
  cinematicTimers.controls = setTimeout(() => {
    if (cinematicMode) {
      document.body.classList.add('controls-hidden');
      document.body.classList.remove('show-description');
    }
  }, 7000);
}

function wakeCinematicControls() {
  if (!cinematicMode) return;
  
  // Remove hidden classes to show all controls
  document.body.classList.remove('controls-hidden', 'nav-hidden');
  
  // Show description
  document.body.classList.add('show-description');
  
  // Restart timers
  startCinematicTimers();
  
  // Auto-hide description after 5 seconds
  clearTimeout(cinematicTimers.desc);
  cinematicTimers.desc = setTimeout(() => {
    if (cinematicMode) {
      document.body.classList.remove('show-description');
    }
  }, 5000);
}

function addCinematicDescription(videoData) {
  const existing = document.querySelector('.cinematic-description');
  if (existing) existing.remove();
  
  const desc = document.createElement('div');
  desc.className = 'cinematic-description';
  desc.innerHTML = `
    <div class="cin-title">${escapeHTML(videoData.title)}</div>
    <div class="cin-desc">${escapeHTML(videoData.description || videoData.title)}</div>
    <div class="cin-meta">
      <span>${escapeHTML(videoData.user)} ${videoData.verified ? '✓' : ''}</span>
      <span>•</span>
      <span><span class="cin-music-icon">🎵</span> ${escapeHTML(videoData.music || 'Original Sound')}</span>
      ${videoData.tags && videoData.tags.length ? `<span>•</span><span>${videoData.tags.map(t => '#' + t).join(' ')}</span>` : ''}
    </div>
  `;
  
  // Prevent tap on description from triggering wake (let it scroll instead)
  desc.addEventListener('click', e => e.stopPropagation());
  desc.addEventListener('touchstart', e => e.stopPropagation());
  
  document.getElementById('app').appendChild(desc);
}

function addCinematicExitButton() {
  const existing = document.querySelector('.cinematic-exit');
  if (existing) existing.remove();
  
  const exit = document.createElement('button');
  exit.className = 'cinematic-exit';
  exit.innerHTML = '✕';
  exit.addEventListener('click', (e) => {
    e.stopPropagation();
    disableCinematicMode();
  });
  
  document.getElementById('app').appendChild(exit);
}

function showCinematicHint(text) {
  const existing = document.querySelector('.cinematic-hint');
  if (existing) existing.remove();
  
  const hint = document.createElement('div');
  hint.className = 'cinematic-hint';
  hint.textContent = text;
  document.getElementById('app').appendChild(hint);
  
  // Show hint briefly
  requestAnimationFrame(() => {
    hint.classList.add('show');
  });
  
  cinematicTimers.hint = setTimeout(() => {
    hint.classList.remove('show');
    setTimeout(() => {
      if (hint.parentNode) hint.remove();
    }, 400);
  }, 3000);
}

function is16by9(videoEl) {
  if (!videoEl.videoWidth || !videoEl.videoHeight) return false;
  const ratio = videoEl.videoWidth / videoEl.videoHeight;
  // Allow small tolerance for 16:9 (1.777...)
  return Math.abs(ratio - 16/9) < 0.1;
}

function renderFeed(){
  const allVideos=[...state.uploadedVideos,...VIDEOS];
  
  feed.innerHTML=allVideos.map((v,i)=>`<div class="video-item" data-id="${v.id}" data-idx="${i}">
    <div class="loader"><div class="spinner"></div><div class="loader-text">Loading...</div></div>
    <video src="${v.sources?v.sources[0]:v.url}" loop playsinline webkit-playsinline preload="metadata" muted></video>
    <div class="overlay"></div>
    <div class="progress-bar"><div class="progress-fill" id="progress-${v.id}"></div></div>
    <div class="play-ind"><div class="ring">▶</div></div>
    <div class="double-tap-heart">❤️</div>
    <div class="v-controls">
      <button class="speed-btn" id="speed-${v.id}" data-vid="${v.id}">${state.playbackSpeed}x</button>
      <button class="v-fill-btn" id="fill-${v.id}" data-vid="${v.id}">⛶ Fill</button>
    </div>
    <div class="side-actions">
      <button class="act like ${state.liked[v.id]?'liked':''}" data-act="like">
        <div class="ico">${state.liked[v.id]?'❤️':'🤍'}</div>
        <span class="count">${fmt(v.likes+(state.liked[v.id]?1:0))}</span>
      </button>
      <button class="act" data-act="comment">
        <div class="ico">💬</div>
        <span class="count">${fmt((state.comments[v.id] || []).length || v.comments || 0)}</span>
      </button>
      <button class="act" data-act="share">
        <div class="ico">${SHARE_ICON_SVG}</div>
        <span class="count">${fmt(v.shares||0)}</span>
      </button>
      <button class="act sound-btn ${state.soundOn ? 'sound-on' : 'sound-off'}" data-act="sound">
        <div class="ico">${state.soundOn ? '🔊' : '🔇'}</div>
        <span class="count">${state.soundOn ? 'ON' : 'OFF'}</span>
      </button>
      <button class="act" data-act="remix">
        <div class="ico">♻️</div>
      </button>
    </div>
    <div class="bottom-info">
      <div class="user">${escapeHTML(v.user)} ${v.verified?'<span class="verified">✓</span>':''}</div>
      <div class="title">${escapeHTML(v.title)}</div>
      <div class="music"><span class="music-icon"></span> ${escapeHTML(v.music||'Original Sound')}</div>
    </div>
  </div>`).join('');
  
  const observer=new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      const video=entry.target.querySelector('video');
      const playInd=entry.target.querySelector('.play-ind');
      const id=+entry.target.dataset.id;
      
      if(entry.isIntersecting){
        video.muted = !state.soundOn;
        video.volume = 1.0;
        video.playbackRate = state.playbackSpeed;
        
        const playPromise = video.play();
        if(playPromise !== undefined){
          playPromise.catch(error=>{
            console.log("Autoplay prevented:", error);
            playInd.querySelector('.ring').textContent='▶';
            playInd.classList.add('show');
            setTimeout(()=>playInd.classList.remove('show'),1500);
          });
        }
      }else{
        video.pause();
        video.currentTime=0;
        const progressBar=document.getElementById('progress-'+id);
        if(progressBar)progressBar.style.width='0%';
      }
    });
  },{threshold:0.6});

  feed.querySelectorAll('.video-item').forEach((el,idx)=>{
    const video=el.querySelector('video'),loader=el.querySelector('.loader'),playInd=el.querySelector('.play-ind'),doubleTapHeart=el.querySelector('.double-tap-heart'),id=+el.dataset.id;
    const progressBar=document.getElementById('progress-'+id);
    const v=allVideos.find(x=>x.id===id);
    const sourceList = Array.isArray(v && v.sources) && v.sources.length ? v.sources : (v && v.url ? [v.url] : []);
    let sourceIndex = 0, loadTimeout = null, sourceGeneration = 0, switchingSource = false;

    video.muted = !state.soundOn;
    video.volume = 1.0;
    video.playbackRate = state.playbackSpeed;
    observer.observe(el);

    if (video && progressBar) {
      video.addEventListener('timeupdate', () => {
        if (video.duration) progressBar.style.width = ((video.currentTime / video.duration) * 100) + '%';
      });
    }

    function showVideoFailure(message) {
      clearTimeout(loadTimeout);
      loader.querySelector('.loader-text').textContent = message;
      loader.style.display = 'flex';
      el.dataset.retry = 'true';
    }

    function startSource(index) {
      if (!sourceList.length) { showVideoFailure('वीडियो का URL उपलब्ध नहीं है'); return; }
      clearTimeout(loadTimeout);
      sourceIndex = index;
      sourceGeneration++;
      const generation = sourceGeneration;
      switchingSource = true;
      el.dataset.retry = 'false';
      loader.querySelector('.loader-text').textContent = index ? `दूसरा स्रोत आज़मा रहे हैं (${index + 1}/${sourceList.length})...` : 'Loading...';
      loader.style.display = 'flex';
      video.src = sourceList[index];
      video.load();
      setTimeout(() => { if (generation === sourceGeneration) switchingSource = false; }, 700);
      loadTimeout = setTimeout(() => {
        if (generation !== sourceGeneration) return;
        if (video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) advanceSource('लोड होने में समय लग रहा है');
      }, 8000);
    }

    function advanceSource(reason) {
      if (switchingSource) return;
      clearTimeout(loadTimeout);
      if (sourceIndex + 1 < sourceList.length) {
        startSource(sourceIndex + 1);
      } else {
        showVideoFailure('वीडियो नहीं चला। टैप करके फिर कोशिश करें');
        console.warn('Video source failed:', reason, sourceList[sourceIndex]);
      }
    }

    video.addEventListener('loadeddata', () => {
      clearTimeout(loadTimeout);
      loader.style.display = 'none';
      if (idx === 0) video.play().catch(() => {
        playInd.querySelector('.ring').textContent = '▶';
        playInd.classList.add('show');
      });
    });
    video.addEventListener('waiting', () => {
      loader.style.display = 'flex';
    });
    video.addEventListener('playing', () => {
      clearTimeout(loadTimeout);
      loader.style.display = 'none';
      playInd.classList.remove('show');
    });
    video.addEventListener('canplay', () => {
      clearTimeout(loadTimeout);
      loader.style.display = 'none';
    });
    video.addEventListener('error', () => {
      if (switchingSource) return;
      advanceSource(video.error ? `MediaError ${video.error.code}` : 'source error');
    });
    startSource(0);
    
    el.addEventListener('click',e=>{
      if(e.target.closest('.side-actions')||e.target.closest('.bottom-info')||e.target.closest('.v-controls'))return;
      if (e.target.closest('.cinematic-exit') || e.target.closest('.cinematic-description')) return;
      
      // ===== Cinematic Mode Tap Handling =====
      if (cinematicMode) {
        // In cinematic mode, tap wakes controls (and can also toggle play/pause with double tap)
        const now = Date.now();
        if (now - state.lastTap < 300 && state.lastTapId === id) {
          // Double tap - like the video
          if (!state.liked[id]) {
            state.liked[id] = true;
            writeJSON('liked', state.liked);
            const likeBtn = el.querySelector('.act.like');
            likeBtn.classList.add('liked');
            likeBtn.querySelector('.ico').textContent = '❤️';
            let count = v.likes + 1;
            likeBtn.querySelector('.count').textContent = fmt(count);
          }
          doubleTapHeart.classList.add('show');
          setTimeout(() => doubleTapHeart.classList.remove('show'), 800);
        } else {
          // Single tap - wake controls and toggle play/pause
          wakeCinematicControls();
          
          if (video.paused) {
            video.play().catch(() => {});
            playInd.classList.remove('show');
          } else {
            video.pause();
            playInd.querySelector('.ring').textContent = '▶';
            playInd.classList.add('show');
            setTimeout(() => playInd.classList.remove('show'), 500);
          }
        }
        state.lastTap = now;
        state.lastTapId = id;
        return;
      }
      
      if (el.dataset.retry === "true") {
        startSource(0);
        return;
      }
      
      const now=Date.now();
      if(now-state.lastTap<300 && state.lastTapId === id){
        if(!state.liked[id]){
          state.liked[id]=true;
          writeJSON('liked', state.liked);
          const likeBtn=el.querySelector('.act.like');
          likeBtn.classList.add('liked');
          likeBtn.querySelector('.ico').textContent='❤️';
          let count=v.likes+1;
          likeBtn.querySelector('.count').textContent=fmt(count);
        }
        doubleTapHeart.classList.add('show');
        setTimeout(()=>doubleTapHeart.classList.remove('show'),800);
      }else{
        setTimeout(()=>{
          if(Date.now()-state.lastTap>=300 && state.lastTapId === id){
            if(video.paused){
              video.play().catch(()=>{});
              playInd.classList.remove('show');
            }else{
              video.pause();
              playInd.querySelector('.ring').textContent='▶';
              playInd.classList.add('show');
              setTimeout(()=>playInd.classList.remove('show'),500);
            }
          }
        },300);
      }
      state.lastTap=now;
      state.lastTapId=id;
    });
  });
  
  feed.querySelectorAll('.v-fill-btn').forEach(btn=>{
    btn.addEventListener('click',function(e){
      e.stopPropagation();e.preventDefault();
      const vid=+this.dataset.vid;
      const el=feed.querySelector(`.video-item[data-id="${vid}"]`);
      const video=el.querySelector('video');
      const videoData = allVideos.find(v => v.id === vid);
      const isFilled=video.classList.contains('fit-cover');
      if(isFilled){
        video.classList.remove('fit-cover');
        this.textContent='⛶ Fill';
        this.classList.remove('active');
        disableAutoHide();
        
        // If in cinematic mode, disable it
        if (cinematicMode) {
          disableCinematicMode();
        }
        
        toast("Fill OFF");
      }else{
        video.classList.add('fit-cover');
        this.textContent='⛶ Filled';
        this.classList.add('active');
        enableAutoHide();
        
        // Check if video is 16:9, if yes enable cinematic mode
        if (videoData) {
          // Wait a bit for video dimensions to be available
          const checkAspect = () => {
            if (video.videoWidth && video.videoHeight) {
              if (is16by9(video)) {
                enableCinematicMode(video, videoData);
              } else {
                toast("Fill ON (Cinematic mode not available for this aspect ratio)");
              }
            } else {
              // If dimensions not available yet, try after metadata loads
              video.addEventListener('loadedmetadata', () => {
                if (is16by9(video) && !cinematicMode) {
                  enableCinematicMode(video, videoData);
                } else if (!cinematicMode) {
                  toast("Fill ON");
                }
              }, { once: true });
              
              // Fallback: check again after 500ms
              setTimeout(() => {
                if (!cinematicMode && is16by9(video)) {
                  enableCinematicMode(video, videoData);
                } else if (!cinematicMode) {
                  toast("Fill ON");
                }
              }, 500);
            }
          };
          
          checkAspect();
        }
      }
    });
  });
  
  feed.querySelectorAll('.speed-btn').forEach(btn=>{
    btn.addEventListener('click',function(e){
      e.stopPropagation();
      const speeds=[0.5,1.0,1.5,2.0];
      const currentIdx=speeds.indexOf(state.playbackSpeed);
      const nextIdx=(currentIdx+1)%speeds.length;
      state.playbackSpeed=speeds[nextIdx];
      this.textContent=state.playbackSpeed+'x';
      feed.querySelectorAll('video').forEach(v=>v.playbackRate=state.playbackSpeed);
      toast("Speed: "+state.playbackSpeed+"x");
    });
  });
  
  feed.onclick = e => {
    const btn=e.target.closest('.act');
    if(!btn)return;
    e.stopPropagation();
    
    const id=+btn.closest('.video-item').dataset.id;
    const v=allVideos.find(x=>x.id===id);
    const action=btn.dataset.act;
    
    if(action==='sound'){
      toggleSound();
    }else if(action==='like'){
      state.liked[id]=!state.liked[id];
      writeJSON('liked', state.liked);
      btn.classList.toggle('liked');
      btn.querySelector('.ico').textContent=state.liked[id]?'❤️':'🤍';
      let count=v.likes;
      if(state.liked[id])count++;
      btn.querySelector('.count').textContent=fmt(count);
    }else if(action==='comment'){
      openComments(id);
    }else if(action==='share'){
      openShare(id);
    }else if(action==='remix'){
      openModal('remixModal');
    }
  };
}

let uploadedFile=null;
let originalFileSize=0;
let ffmpeg=null;
let compQuality='medium';
let isCompressed=false;

const QUALITY_PRESETS = {
  high: { res: '1920:1080', crf: '23', bitrate: '2500k', preset: 'medium' },
  medium: { res: '1280:720', crf: '26', bitrate: '1500k', preset: 'fast' },
  low: { res: '854:480', crf: '28', bitrate: '800k', preset: 'fast' }
};

function setCompQuality(q, btn) {
  compQuality = q;
  document.querySelectorAll('.q-opt').forEach(b => {
    b.classList.remove('active');
  });
  btn.classList.add('active');
}

async function startCompression() {
  if (!uploadedFile) return;
  
  const btn = document.getElementById('btnCompress');
  btn.disabled = true;
  btn.innerHTML = '⏳ Loading Engine...';
  document.getElementById('compProgress').style.display = 'block';
  document.getElementById('compResult').style.display = 'none';

  try {
    if (typeof FFmpeg === 'undefined') {
      await new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js';
        script.onload = resolve;
        script.onerror = reject;
        document.head.appendChild(script);
      });
    }
    
    if (!ffmpeg || !ffmpeg.isLoaded()) {
      const { createFFmpeg } = FFmpeg;
      ffmpeg = createFFmpeg({ 
        log: false,
        progress: ({ ratio }) => {
          const pct = Math.round(ratio * 100);
          document.getElementById('compBar').style.width = pct + '%';
          document.getElementById('compText').textContent = `Compressing... ${pct}%`;
        }
      });
      await ffmpeg.load();
    }
    
    document.getElementById('compText').textContent = 'Reading file...';
    document.getElementById('compBar').style.width = '10%';
    
    const inputName = 'input.mp4';
    const outputName = 'output.mp4';
    
    const arrayBuffer = await uploadedFile.arrayBuffer();
    ffmpeg.FS('writeFile', inputName, new Uint8Array(arrayBuffer));
    
    document.getElementById('compText').textContent = 'Compressing (please wait)...';
    document.getElementById('compBar').style.width = '20%';
    
    const preset = QUALITY_PRESETS[compQuality];
    await ffmpeg.run(
      '-i', inputName,
      '-vf', `scale=${preset.res}:force_original_aspect_ratio=decrease,pad=${preset.res}:(ow-iw)/2:(oh-ih)/2`,
      '-c:v', 'libx264',
      '-preset', preset.preset,
      '-crf', preset.crf,
      '-b:v', preset.bitrate,
      '-c:a', 'aac',
      '-b:a', '128k',
      '-movflags', '+faststart',
      '-pix_fmt', 'yuv420p',
      outputName
    );
    
    document.getElementById('compBar').style.width = '95%';
    document.getElementById('compText').textContent = 'Finalizing...';
    
    const data = ffmpeg.FS('readFile', outputName);
    const compressedBlob = new Blob([data.buffer], { type: 'video/mp4' });
    
    uploadedFile = new File([compressedBlob], uploadedFile.name, { type: 'video/mp4' });
    document.getElementById('uploadPreview').innerHTML = `<video src="${URL.createObjectURL(uploadedFile)}" controls></video>`;
    
    const saved = Math.max(0, Math.round((1 - (compressedBlob.size / originalFileSize)) * 100));
    
    document.getElementById('compStatus').textContent = 'Compressed ✅';
    document.getElementById('compStatus').style.color = '#00ff88';
    document.getElementById('savedPercent').textContent = saved;
    document.getElementById('compResult').style.display = 'block';
    document.getElementById('compBar').style.width = '100%';
    document.getElementById('compText').textContent = 'Done!';
    
    btn.innerHTML = '✅ Compress Again';
    btn.disabled = false;
    isCompressed = true;
    
    try { ffmpeg.FS('unlink', inputName); ffmpeg.FS('unlink', outputName); } catch(e){}
    
  } catch (err) {
    console.error('Compression error:', err);
    document.getElementById('compText').textContent = 'Failed. Will publish original.';
    document.getElementById('compStatus').textContent = 'Failed ❌';
    document.getElementById('compStatus').style.color = '#ff4444';
    btn.innerHTML = '⚠️ Retry Compression';
    btn.disabled = false;
    isCompressed = false;
  }
}

    likes:0,comments:0,shares:0,views:0,
    music:'Original Sound',
    tags:tags,
    url:url,
    sources:[url]
  };
  state.uploadedVideos.unshift(newVideo);
  persistUploadedMetadata();
  renderFeed();
  document.getElementById('uploadModal').classList.remove('open');
  if(history.state && history.state.modal) history.back();
  document.getElementById('uploadFormContainer').style.display='none';
  document.querySelector('.upload-opts').style.display='flex';
  document.getElementById('uploadTitle').value='';
  document.getElementById('uploadDesc').value='';
  document.getElementById('uploadTags').value='';
  uploadedFile=null;
  toast("वीडियो इस डिवाइस पर सेव हुआ। ऑनलाइन साझा करने के लिए cloud storage/database जोड़ना बाकी है।");
  setTimeout(()=>{
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    document.querySelector('.nav-btn[data-nav="home"]').classList.add('active');
  },500);
});

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

document.getElementById('clearCache').addEventListener('click',async ()=>{
  try { if ('caches' in window) { const keys = await caches.keys(); await Promise.all(keys.filter(k => k.startsWith('sarwai-one-cache')).map(k => caches.delete(k))); } toast('कैश साफ़ किया'); }
  catch (error) { console.warn(error); toast('कैश साफ़ नहीं हो सका'); }
});

document.querySelectorAll('.q-btn').forEach(btn=>{
  if (btn.dataset.q === state.quality) { btn.classList.add('active'); document.getElementById('currentQ').textContent = btn.textContent; }
  else btn.classList.remove('active');
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.q-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.quality=btn.dataset.q;
    localStorage.setItem('quality',state.quality);
    document.getElementById('currentQ').textContent=btn.textContent;
    toast("Quality: "+btn.textContent);
  });
});

document.getElementById('dataSaverBtn').textContent = state.dataSaver ? 'ON' : 'OFF';
document.getElementById('dataSaverBtn').style.color = state.dataSaver ? '#ff2d55' : '#888';
document.getElementById('dataSaverBtn').addEventListener('click',function(){
  state.dataSaver=!state.dataSaver;
  localStorage.setItem('dataSaver',String(state.dataSaver));
  this.textContent=state.dataSaver?'ON':'OFF';
  this.style.color=state.dataSaver?'#ff2d55':'#888';
  toast("Data Saver "+(state.dataSaver?'ON':'OFF'));
});

document.getElementById('autoFillBtn').addEventListener('click',function(){
  state.autoFill=!state.autoFill;
  this.textContent=state.autoFill?'ON':'OFF';
  this.style.color=state.autoFill?'#ff2d55':'#888';
  toast("Auto-Fill "+(state.autoFill?'ON':'OFF'));
  
  feed.querySelectorAll('video').forEach(v => {
    if(state.autoFill) v.classList.add('fit-cover');
    else v.classList.remove('fit-cover');
  });
  feed.querySelectorAll('.v-fill-btn').forEach(btn => {
    if(state.autoFill) {
      btn.textContent = '⛶ Filled';
      btn.classList.add('active');
    } else {
      btn.textContent = '⛶ Fill';
      btn.classList.remove('active');
    }
  });
  if(state.autoFill) enableAutoHide();
  else disableAutoHide();
});

document.querySelectorAll('.topbar .tab-btn').forEach(btn=>{
  btn.addEventListener('click',function(){
    document.querySelectorAll('.topbar .tab-btn').forEach(b=>b.classList.remove('active'));
    this.classList.add('active');
    toast(this.textContent+" feed");
  });
});

document.querySelectorAll('.remix-opt').forEach(btn => {
  btn.addEventListener('click', () => {
    toast("Remix feature coming soon!");
    document.getElementById('remixModal').classList.remove('open');
    if(history.state && history.state.modal) history.back();
  });
});

let touchStartY = 0;
feed.addEventListener('touchstart', e => {
  if (feed.scrollTop === 0 && !cinematicMode) {
    touchStartY = e.touches[0].clientY;
  }
}, { passive: true });

feed.addEventListener('touchmove', e => {
  if (feed.scrollTop === 0 && e.touches[0].clientY - touchStartY > 80 && !cinematicMode) {
    document.getElementById('pullIndicator').classList.add('show');
  }
}, { passive: true });

feed.addEventListener('touchend', e => {
  if (document.getElementById('pullIndicator').classList.contains('show')) {
    toast("Refreshing feed...");
    setTimeout(() => {
      document.getElementById('pullIndicator').classList.remove('show');
      renderFeed();
    }, 1500);
  }
});

// Handle device orientation change (if user rotates phone manually)
window.addEventListener('orientationchange', () => {
  setTimeout(() => {
    if (cinematicMode) {
      // Refresh cinematic view
      wakeCinematicControls();
    }
  }, 300);
});

// Handle page visibility (e.g., switching tabs)
document.addEventListener('visibilitychange', () => {
  if (document.hidden && cinematicMode) {
    // Pause video when hidden in cinematic mode
    const activeVideo = document.querySelector(`.video-item[data-id="${cinematicActiveVideoId}"] video`);
    if (activeVideo && !activeVideo.paused) {
      activeVideo.pause();
    }
  }
});

// Keyboard shortcuts for cinematic mode
document.addEventListener('keydown', (e) => {
  if (!cinematicMode) return;
  
  switch(e.key) {
    case 'Escape':
      disableCinematicMode();
      break;
    case ' ':
      e.preventDefault();
      const activeVideo = document.querySelector(`.video-item[data-id="${cinematicActiveVideoId}"] video`);
      if (activeVideo) {
        if (activeVideo.paused) {
          activeVideo.play().catch(() => {});
        } else {
          activeVideo.pause();
        }
      }
      wakeCinematicControls();
      break;
    case 'f':
    case 'F':
      disableCinematicMode();
      break;
  }
});

</script>
</body>
</html>
